name: "3.3.1 – Monthly Scraper · CONAB (Brazil supply)"

on:
  # Primary trigger is '1.17 - Source Sentinel': it probes the source daily in
  # its release window and dispatches this workflow the day CONAB publishes,
  # which is days earlier than any fixed date could be.
  #
  # The cron below is a SAFETY NET, restored 2026-08-30. Removing it outright
  # in August made detection the only path to the data, and detection has never
  # once fired: the sentinel state for `conab` still reads last_found: null,
  # signal: null, confirmed: "2026-07". It correctly raised both overdue_alerted
  # and blind_alerted for August — so the alarm worked and nothing listened,
  # because an alarm cannot fetch anything. conab_costs and conab_safra went 48
  # days stale as a result.
  #
  # Two dates, not one, because a monthly cron has no second chance: GitHub
  # skips schedules on this repo (every scheduled workflow silently missed
  # 2026-08-27) and a skipped monthly fire loses the whole month. The 20th is a
  # no-op when the 12th worked — run_monthly upserts by month, so a re-run of
  # an already-ingested release changes nothing.
  schedule:
    - cron: '37 6 12 * *'
    - cron: '37 6 20 * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/scraper/requirements.txt

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r scraper/requirements.txt pandas requests python-dotenv openpyxl xlrd

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Playwright browser
        run: sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* || true; playwright install chromium --with-deps || playwright install chromium

      - name: Run CONAB scraper (3 attempts)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          for attempt in 1 2 3; do
            python -m scraper.run_monthly conab && break
            [ $attempt -lt 3 ] && echo "Attempt $attempt failed, retrying in 5m..." && sleep 300 || exit 1
          done

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=🚨 ${{ github.workflow }} failed — $(date -u +'%Y-%m-%d %H:%M UTC') — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
