name: "1.15 – Monthly CPI Scraper (US CPI · Retail Coffee CPI)"

# CPI sources publish monthly, so they don't belong in the daily news scraper
# (where they re-fetched the same numbers ~30×/month). This workflow runs them
# on a schedule that tracks the actual releases.

on:
  schedule:
    # US BLS CPI-U drops ~08:30 ET (12:30/13:30 UTC) on a day between the
    # 10th–18th; Brazil BCB IPCA lands ~10th; Eurostat HICP mid-month. Narrowed
    # to the 11th–16th (the window the BLS release has actually fallen in) at
    # 13:40 UTC — the exporter only commits when the numbers change, and the
    # 1st-of-month backstop below still catches an unusually late release.
    - cron: '40 13 11-16 * *'
    # 1st-of-month backstop for any late or missed release.
    - cron: '0 3 1 * *'
  workflow_dispatch:

# Own lane — NOT the shared `data-commit` group.
#
# 25 workflows used to sit in that one group. GitHub's concurrency model only
# protects the RUNNING member: `cancel-in-progress: false` keeps the in-progress
# run alive, but the queue holds exactly ONE pending run, so whenever a third
# member arrives the one already waiting is CANCELLED outright — its scraped
# data thrown away before it ever ran. Observed 2026-08-14 on 1.3 Daily OI:
# three cancelled runs in one morning, one of them killed after 31 minutes.
# 1.16 hit the same thing and was given its own lane in August for exactly this
# reason; this generalises that fix.
#
# Serialising the push is what the shared group was really buying, and that is
# now handled properly by .github/actions/commit-data, which re-syncs with
# origin/main and retries with backoff on every attempt.
concurrency:
  group: scraper-cpi
  cancel-in-progress: false

jobs:
  cpi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/scraper/requirements.txt

      # Playwright is the BLS fallback path: BLS's Cloudflare intermittently
      # blocks datacenter IPs on the keyless tier (persistent 503s from GH
      # runners observed 2026-08-09), and a real browser passes where plain
      # requests cannot. Primary path remains plain HTTP.
      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r scraper/requirements.txt pandas requests python-dotenv openpyxl playwright

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Playwright browser
        run: sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* || true; playwright install chromium --with-deps || playwright install chromium

      - name: Run CPI scrapers (3 attempts)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Optional: lifts the BLS API window from 10 to 20 years. Works
          # without it (keyless access allows 25 queries/day).
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: |
          for attempt in 1 2 3; do
            python -m scraper.cpi_scraper && break
            [ $attempt -lt 3 ] && echo "Attempt $attempt failed, retrying in 5m..." && sleep 300 || exit 1
          done

      - name: Export CPI static JSON (3 attempts)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: |
          for attempt in 1 2 3; do
            python -m scraper.export_static_json --only us_cpi,retail_cpi && break
            [ $attempt -lt 3 ] && echo "Attempt $attempt failed, retrying in 5m..." && sleep 300 || exit 1
          done

      - name: Commit updated CPI JSON if changed
        uses: ./.github/actions/commit-data
        with:
          files: |
            frontend/public/data/us_cpi.json
            frontend/public/data/retail_cpi.json
            frontend/public/data/health.json
          message: "data: monthly CPI update [skip ci]"

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=🚨 ${{ github.workflow }} failed — $(date -u +'%Y-%m-%d %H:%M UTC') — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
