name: "1.96 – Fetch Intraday KC/RC 15min (Barchart)"

# Gathers the 15-min intraday points the open-direction feature needs for both
# robusta (RM) and arabica (KC) from Barchart, plus archive settles. Scoped to
# a ~1-month window first for validation (maxrecords default 2000). See
# backend/scraper/fetch_intraday_kc_rc.py. workflow_dispatch only for now.

on:
  workflow_dispatch:
    inputs:
      maxrecords:
        description: "Bars per contract (2000 ≈ 1.5 months at 15m; 5000 ≈ full ~9 months)"
        required: false
        default: "2000"
        type: string

# Own lane — NOT the shared `data-commit` group.
#
# 25 workflows used to sit in that one group. GitHub's concurrency model only
# protects the RUNNING member: `cancel-in-progress: false` keeps the in-progress
# run alive, but the queue holds exactly ONE pending run, so whenever a third
# member arrives the one already waiting is CANCELLED outright — its scraped
# data thrown away before it ever ran. Observed 2026-08-14 on 1.3 Daily OI:
# three cancelled runs in one morning, one of them killed after 31 minutes.
# 1.16 hit the same thing and was given its own lane in August for exactly this
# reason; this generalises that fix.
#
# Serialising the push is what the shared group was really buying, and that is
# now handled properly by .github/actions/commit-data, which re-syncs with
# origin/main and retries with backoff on every attempt.
concurrency:
  group: fetch-intraday-kc-rc
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps + chromium
        run: |
          pip install --quiet playwright
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* || true
          playwright install chromium --with-deps || playwright install chromium
      - name: Fetch 15-min intraday
        working-directory: backend
        run: python -m scraper.fetch_intraday_kc_rc --maxrecords "${{ inputs.maxrecords }}"
      - name: Commit intraday history
        uses: ./.github/actions/commit-data
        with:
          files: frontend/public/data/intraday_kc_rc_15min.json
          message: "data: intraday KC/RC 15min (Barchart) [skip ci]"
