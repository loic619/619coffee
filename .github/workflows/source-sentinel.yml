name: "1.17 – Source Sentinel (monthly supply releases)"

# One cheap daily sweep (~30 s) that detects the PUBLICATION DAY of each
# monthly supply source and dispatches its heavy scraper the same day —
# replacing date-guessing crons. Per-source release windows + a keep-probing-
# daily-when-late rule live in backend/scripts/source_sentinel.py, alongside
# the probe catalogue (Cecafé, DANE, FNC, UCDA, CONAB, Comex, VN Customs).
#
# TRIAL (2026-08 → 2026-09): the existing monthly crons stay untouched as
# the safety net; the scrapers are idempotent so a sentinel+cron double-run
# is harmless. After a clean month the crons can be widened/retired.
#
# 06:37 UTC: after the nightly data pipeline settles, before the 07:00
# freshness check; off-:00 to dodge the GH cron-skip on round marks.

on:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:
  # Same-day digests: the daily sweep DETECTS a release and dispatches its
  # scraper, but the scraper commits its data after that sweep has finished —
  # so the ingestion check (and the numbers that ride it) used to wait for the
  # next morning. Every workflow that publishes data a sentinel source is
  # verified against now re-triggers the sentinel in --verify-only mode, which
  # closes out pending checks immediately without probing or dispatching.
  workflow_run:
    workflows:
      - "3.2 – Cecafe Export Scraper"
      - "0.10 – Colombia coffee exports (monthly · DANE + FNC)"
      - "3.3.5 – Monthly Scraper · Uganda UCDA Reports"
      - "3.3.1 – Monthly Scraper · CONAB (Brazil supply)"
      - "3.3.2 – Monthly Scraper · Brazil Fertilizer (Comex)"
      - "3.3.4 – Monthly Scraper · Vietnam Coffee Exports"
      - "0.9 – VN Customs by-country (5X/5N) probe / backfill"
      - "3.4 – ECF stocks"
      # The export pipeline owns the published JSON for several sources
      # (uganda_monthly, vn_export_by_destination, cot, freight).
      - "1.4 – Export and Publish Static JSON"
    types: [completed]

# Own concurrency group — sharing a global data-commit group got the Uganda
# monthly run silently CANCELLED once (GitHub keeps only one queued run per
# group). The state-file commit below rebases with -theirs, so global
# serialization isn't needed.
concurrency:
  group: source-sentinel
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write     # commit data/source_sentinels.json
      actions: write      # workflow_dispatch the per-source scrapers

    steps:
      # ref: main — a workflow_run fire checks out the SHA that triggered it,
      # which predates the data commit we are here to verify.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Probe sources & dispatch on new releases
        env:
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        # A data-publish trigger only closes out pending ingestion checks; the
        # scheduled/manual run does the full probe-and-dispatch sweep.
        run: |
          python backend/scripts/source_sentinel.py \
            ${{ github.event_name == 'workflow_run' && '--verify-only' || '' }}

      - name: Commit sentinel state if changed
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/source_sentinels.json
          if git diff --cached --quiet; then
            echo "No state change."
            exit 0
          fi
          git commit -m "data: source-sentinel state $(date -u +%Y-%m-%d) [skip ci]"
          ok=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash --strategy-option=theirs origin "${GITHUB_REF_NAME}" && git push; then ok=1; break; fi
            echo "push attempt $attempt failed (concurrent push?); retrying in $((5*attempt))s…"; sleep $((5 * attempt))
          done
          [ "$ok" = 1 ] || { echo "push failed after 5 attempts"; exit 1; }

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=🚨 1.17 – Source Sentinel failed — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
