name: "0.21 – Probe: ICE expiry calendar (FND ground truth)"

# Dispatch-only. Prints what ICE itself publishes for Coffee "C" (KC) and
# Robusta (RC): the contract identity (so we know which product page we read),
# the notice/expiry RULES, and the dated expiry table — so the rule encoded in
# backend/contract_dates.py + frontend/lib/fnd.ts is checked against the
# exchange rather than against memory. ice.com is egress-blocked from the agent
# sandbox; a runner is not.
#
# Run 2 (2026-09-03) is why the identity line exists: product 37089080, which
# the repo had assumed was Robusta, is WHITE SUGAR. Its "fifteen calendar days"
# rule is sugar's. The Robusta id is therefore DISCOVERED from ICE's own
# listing page rather than hard-coded. KC's table matched lib/fnd.ts exactly,
# holiday-shifted KCZ26 = 19 Nov included.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and extract
        run: |
          set -e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          get() { curl -sSL -A "$UA" --max-time 40 "$1" -o "$2" && echo "bytes: $(wc -c < "$2")"; }
          extract() {  # $1 = html file, $2 = label
            python3 - "$1" "$2" <<'PY'
          import html, re, sys
          path, label = sys.argv[1], sys.argv[2]
          raw = open(path, encoding="utf-8", errors="replace").read()
          title = re.search(r"<title>(.*?)</title>", raw, re.S | re.I)
          print(f"  [{label}] <title>: {html.unescape(title.group(1)).strip()[:120] if title else '?'}")
          t = re.sub(r"<script.*?</script>|<style.*?</style>", " ", raw, flags=re.S | re.I)
          t = html.unescape(re.sub(r"<[^>]+>", "\n", t))
          lines = [l.strip() for l in t.splitlines() if l.strip()]
          keys = ("notice day", "last trading", "tender", "delivery period", "delivery month",
                  "contract size", "unit of trading", "contract symbol", "symbol code", "contract series")
          seen = set()
          for i, l in enumerate(lines):
              low = l.lower()
              if any(k in low for k in keys) and len(l) < 90:
                  ctx = " | ".join(lines[i: i + 3])
                  if ctx not in seen:
                      seen.add(ctx); print("   ", ctx[:260])
          dates = [l for l in lines if re.fullmatch(r"\d{1,2}/\d{1,2}/20(2[6-8])", l)]
          if dates:
              print(f"  [{label}] dated cells ({len(dates)}), in page order — read the header row on ice.com to name the columns:")
              for j in range(0, len(dates), 6):
                  print("     ", " | ".join(dates[j:j+6]))
          PY
          }

          echo "=================== discover product ids from ICE's listing ==================="
          get "https://www.ice.com/products/Futures-Options/Agriculture" listing.html
          python3 - <<'PY' > ids.txt
          import re
          t = open("listing.html", encoding="utf-8", errors="replace").read()
          for m in re.finditer(r'href="(/products/(\d+)/([^"/?#]+))"', t):
              slug = m.group(3)
              if re.search(r"(?i)coffee", slug):
                  print(m.group(2), slug)
          PY
          sort -u ids.txt; echo

          if [ ! -s ids.txt ]; then
            echo "listing yielded no coffee products — falling back to the known KC id and a search page"
            echo "15 Coffee-C-Futures" > ids.txt
            get "https://www.ice.com/products?search=robusta" search.html
            grep -oE '/products/[0-9]+/[^"/?#]*[Rr]obusta[^"/?#]*' search.html | sort -u | sed 's#/products/##; s#/# #' >> ids.txt || true
          fi

          while read -r id slug; do
            [ -z "$id" ] && continue
            echo "=================== ICE $slug ($id) ==================="
            for tab in "" "/expiry"; do
              url="https://www.ice.com/products/${id}/${slug}${tab}"
              echo "--- $url"
              get "$url" page.html || { echo "fetch failed"; continue; }
              extract page.html "$slug$tab"
            done
          done < <(sort -u ids.txt)
