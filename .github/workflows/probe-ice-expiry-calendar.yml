name: "0.21 – Probe: ICE expiry calendar (FND ground truth)"

# Dispatch-only. Prints the First Notice Day / Last Trading Day rows ICE itself
# publishes for Coffee "C" (KC) and Robusta (RC), so the rule encoded in
# frontend/lib/fnd.ts can be checked against the exchange rather than against
# memory. ice.com is egress-blocked from the agent sandbox; a runner is not.
#
# Read the output next to lib/__tests__/fnd.test.ts: every date the library
# derives must appear here. If one does not, the RULE is wrong (most likely
# the Robusta "four business days" figure), not the holiday table.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and extract
        run: |
          set -e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          for spec in "KC|15|Coffee-C-Futures" "RC|37089080|Robusta-Coffee-Futures"; do
            IFS='|' read -r code id slug <<< "$spec"
            echo "=================== $code ==================="
            for tab in "" "/expiry"; do
              url="https://www.ice.com/products/${id}/${slug}${tab}"
              echo "--- $url"
              curl -sSL -A "$UA" --max-time 40 "$url" -o page.html || { echo "fetch failed"; continue; }
              echo "bytes: $(wc -c < page.html)"
              python3 - <<'PY'
          import html, re
          t = open("page.html", encoding="utf-8", errors="replace").read()
          t = re.sub(r"<script.*?</script>|<style.*?</style>", " ", t, flags=re.S | re.I)
          t = html.unescape(re.sub(r"<[^>]+>", "\n", t))
          lines = [l.strip() for l in t.splitlines() if l.strip()]
          keys = ("notice", "last trading", "tender", "delivery month", "first business", "business day")
          for i, l in enumerate(lines):
              if any(k in l.lower() for k in keys):
                  ctx = " | ".join(lines[max(0, i - 1): i + 3])
                  print("  ", ctx[:300])
          # Any explicit dates in 2026/2027 near the word Notice
          for m in re.finditer(r"(?i)(notice[^\n]{0,80})", t):
              pass
          PY
            done
          done
