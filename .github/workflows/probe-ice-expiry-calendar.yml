name: "0.21 – Probe: ICE expiry calendar (FND ground truth)"

# Dispatch-only. Prints what ICE itself publishes for Coffee "C" (KC) and
# Robusta (RC): the contract identity (so we know which product page we read),
# the notice/expiry RULES, and the dated expiry table — so the rule encoded in
# backend/contract_dates.py + frontend/lib/fnd.ts is checked against the
# exchange rather than against memory. ice.com is egress-blocked from the agent
# sandbox; a runner is not.
#
# First run (2026-09-03) found KC's "seven business days prior" verbatim, and
# for Robusta "fifteen calendar days preceding the first day of the delivery
# period, next business day if not one" — NOT the four business days the repo
# had carried since day one. Barchart is fetched as a second witness.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and extract
        run: |
          set -e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          extract() {  # $1 = html file, $2 = label
            python3 - "$1" "$2" <<'PY'
          import html, re, sys
          path, label = sys.argv[1], sys.argv[2]
          raw = open(path, encoding="utf-8", errors="replace").read()
          title = re.search(r"<title>(.*?)</title>", raw, re.S | re.I)
          print(f"  [{label}] <title>: {html.unescape(title.group(1)).strip()[:120] if title else '?'}")
          t = re.sub(r"<script.*?</script>|<style.*?</style>", " ", raw, flags=re.S | re.I)
          t = html.unescape(re.sub(r"<[^>]+>", "\n", t))
          lines = [l.strip() for l in t.splitlines() if l.strip()]
          keys = ("notice day", "last trading", "tender", "delivery period", "delivery month",
                  "contract size", "unit of trading", "currency", "symbol", "product code",
                  "contract series", "listing", "exchange")
          seen = set()
          for i, l in enumerate(lines):
              low = l.lower()
              if any(k in low for k in keys) and len(l) < 90:
                  ctx = " | ".join(lines[i: i + 2])
                  if ctx not in seen:
                      seen.add(ctx); print("   ", ctx[:220])
          # Dated rows: anything that looks like a 2026/2027 date with a contract month nearby.
          dates = [l for l in lines if re.search(r"\b(20(2[6-7]))\b", l) and len(l) < 60]
          if dates:
              print(f"  [{label}] dated lines ({len(dates)}):")
              for l in dates[:60]: print("     ", l)
          PY
          }
          for spec in "KC|15|Coffee-C-Futures" "RC|37089080|Robusta-Coffee-Futures"; do
            IFS='|' read -r code id slug <<< "$spec"
            echo "=================== ICE $code ==================="
            for tab in "" "/expiry"; do
              url="https://www.ice.com/products/${id}/${slug}${tab}"
              echo "--- $url"
              curl -sSL -A "$UA" --max-time 40 "$url" -o page.html || { echo "fetch failed"; continue; }
              echo "bytes: $(wc -c < page.html)"
              extract page.html "$code$tab"
            done
          done
          echo "=================== Barchart (second witness) ==================="
          for sym in RMU26 RMX26 KCZ26; do
            url="https://www.barchart.com/futures/quotes/${sym}/profile"
            echo "--- $url"
            curl -sSL -A "$UA" --max-time 40 "$url" -o bc.html || { echo "fetch failed"; continue; }
            echo "bytes: $(wc -c < bc.html)"
            python3 - <<'PY'
          import html, re
          t = open("bc.html", encoding="utf-8", errors="replace").read()
          t = html.unescape(re.sub(r"<[^>]+>", "\n", re.sub(r"<script.*?</script>", " ", t, flags=re.S | re.I)))
          lines = [l.strip() for l in t.splitlines() if l.strip()]
          for i, l in enumerate(lines):
              if re.search(r"(?i)first notice|last trad|expir", l) and len(l) < 60:
                  print("   ", " | ".join(lines[i: i + 3])[:160])
          PY
          done
