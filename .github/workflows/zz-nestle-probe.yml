name: Z.96 – Nestle PDF pattern probe (temporary)

# The HTML pages 403 from CI, but the press releases live on a static file path
# (/sites/default/files/YYYY-MM/...). If that path is not behind the same bot
# protection, the PDFs are reachable directly and no page scrape is needed.
# Also shows how the "Sales performance summary" table extracts, since it is
# TRANSPOSED relative to JDE's: metrics are rows, segments are columns.

on:
  workflow_dispatch:
  push:
    branches: [demand-earnings-revamp]
    paths: [".github/workflows/zz-nestle-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests pdfplumber
      - name: Try the direct PDF pattern
        run: |
          python - <<'PY'
          import io, re, requests, pdfplumber
          UA=("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
              "(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36")
          H={"User-Agent":UA,"Accept-Language":"en-US,en;q=0.9"}
          BASE="https://www.nestle.com/sites/default/files"

          # Publication month per release type; FY lands the following February.
          KINDS = [
            ("three-month-sales", "three-month-sales-press-release", 4, 0),
            ("half-year",         "half-year-results-press-release", 7, 0),
            ("nine-month-sales",  "nine-month-sales-press-release", 10, 0),
            ("full-year",         "full-year-results-press-release", 2, 1),
          ]
          hits=[]
          for year in (2025, 2024):
              for label, slug, month, year_offset in KINDS:
                  d=f"{year+year_offset}-{month:02d}"
                  url=f"{BASE}/{d}/{slug}-{year}-en.pdf"
                  try:
                      r=requests.get(url,headers=H,timeout=60)
                      ok = r.ok and r.content[:1024].find(b"%PDF")>=0
                      print(f"  {year} {label:18s} HTTP {r.status_code} {'PDF' if ok else '   '} {len(r.content):>8} bytes")
                      if ok: hits.append((year,label,url,r.content))
                  except Exception as e:
                      print(f"  {year} {label:18s} EXC {type(e).__name__}")

          # Show the RIG table for the first hit. Nestle's summary is transposed
          # vs JDE's bridge: metrics down the side, segments across the top.
          for year,label,url,content in hits[:2]:
              print(f"\n=== {year} {label} — {url}")
              with pdfplumber.open(io.BytesIO(content)) as pdf:
                  for pageno,page in enumerate(pdf.pages[:8],1):
                      txt=page.extract_text() or ""
                      if not re.search(r"real internal growth|\bRIG\b", txt, re.I): continue
                      for settings in ({"vertical_strategy":"text","horizontal_strategy":"text"},
                                       {"vertical_strategy":"lines","horizontal_strategy":"lines"},
                                       None):
                          try: tables = page.extract_tables(settings) if settings else page.extract_tables()
                          except Exception: continue
                          for t in tables or []:
                              flat=[[re.sub(r"\s+"," ",str(c or "")).strip() for c in row] for row in t]
                              if any(re.search(r"real internal growth|RIG", " ".join(r), re.I) for r in flat):
                                  print(f"  p{pageno} via {settings}:")
                                  for row in flat[:12]: print("     ", row[:9])
                                  raise SystemExit(0)
                      print(f"  p{pageno} mentions RIG but no table matched")
          PY
