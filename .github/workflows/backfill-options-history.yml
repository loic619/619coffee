name: "Z – Backfill: options boards history (manual)"

# One-off/manual: seed data/options_boards_archive.json from Barchart's
# per-option EOD history for the currently-live boards (expired contracts
# return nothing — see backend/scraper/backfill_options_history.py).
# Re-runnable: never overwrites a live-captured board-day.

on:
  workflow_dispatch:
    inputs:
      start:
        description: "History start date (YYYY-MM-DD)"
        required: false
        default: "2024-06-01"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: options-archive-write
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}
      - name: Install dependencies
        run: |
          pip install playwright
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* || true
          playwright install chromium --with-deps || playwright install chromium
      - name: Backfill options history
        env:
          PYTHONPATH: backend
        run: python backend/scraper/backfill_options_history.py "${{ inputs.start || '2024-06-01' }}"
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/options_boards_archive.json
          if git diff --cached --quiet; then echo "No changes."; else
            git commit -m "data: options boards history backfill [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && exit 0
              sleep $((RANDOM % 5 + 3))
            done
            echo "::error::push failed"; exit 1
          fi
