name: "1.20 – Traded tape (acaphe tradespread)"

# ONE fetch per trading day, after both markets have settled — the single
# source for everything acaphe knows about the session.
#
# 18:50 UTC is past the ICE Arabica settle (13:30 ET = 17:30 UTC in EDT, 18:30
# UTC in EST) in BOTH seasons, with enough margin for the exchange to post the
# settlement (~15 min after the bell). London robusta shut an hour earlier
# still. So one cron replaces the old two — the wall-clock guard inside
# fetch_tradespread.py just needs a window wide enough to admit either season,
# not to pick between two fires.
#
# This run also absorbed workflow 0.2 (Capture KC at RC Close), which polled a
# live Redis snapshot 8× a weekday to catch KC's price at the 17:30 London bell.
# The tape carries every print with a timestamp, so that instant is read back
# from it here — one run instead of eight, for every contract rather than just
# the front. 0.2 is retired; see its file for the details.

on:
  schedule:
    - cron: '50 18 * * 1-5'    # 14:50 ET (EDT) / 13:50 ET (EST)
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the post-close window guard (manual test)"
        type: boolean
        default: false

concurrency:
  group: tradespread
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: backend
        run: pip install --quiet -r scraper/requirements.txt
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}
      # ubuntu-latest (noble) has no `libasound2` — only `libasound2t64` — so
      # `--with-deps` aborts the whole install. Install the OS libs separately
      # and let the browser install stand on its own.
      - name: Install Playwright Chromium
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* || true
          playwright install-deps chromium || sudo apt-get install -y --no-install-recommends libasound2t64 || true
          playwright install chromium
      - name: Fetch the tape
        working-directory: backend
        env:
          ACAPHE_USER: ${{ secrets.ACAPHE_USER }}
          ACAPHE_PASS: ${{ secrets.ACAPHE_PASS }}
        run: |
          PYTHONPATH=. python -m scraper.fetch_tradespread \
            ${{ inputs.force && '--force' || '' }}
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f data/tradespread_archive.json ] && git add data/tradespread_archive.json || true
          [ -f frontend/public/data/tradespread.json ] && git add frontend/public/data/tradespread.json || true
          if git diff --cached --quiet; then echo "No changes."; else
            git commit -m "data: traded tape $(date -u +%Y-%m-%d) [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
              sleep $((RANDOM % 5 + 3))
            done
            echo "::error::push failed"; exit 1
          fi
