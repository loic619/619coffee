name: "1.4 – Export and Publish Static JSON"

on:
  schedule:
    # 02:41 UTC daily — AFTER the Daily OI Snapshot (1.3, 02:13) commits the
    # per-contract archive, so the export consumes today's archive (not
    # yesterday's). Previously 02:30, which ran before 1.3 → OI-derived
    # visuals lagged a day. 41 (not 30) to dodge GH cron skip on :30 marks.
    - cron: '41 2 * * *'
  workflow_dispatch:        # allow manual trigger from GitHub UI
  workflow_run:
    # Also run right after the upstream scrapers finish, so a same-day data
    # update is published without waiting for the next cron. 1.3 (Daily OI)
    # is included so the archive-derived visuals refresh in the same cycle.
    workflows: ["1.1 – Daily News Scraper", "2.3 – COT Scraper", "1.3 – Daily OI Snapshot"]
    types: [completed]

# Serialize overlapping runs onto a single queue. Without this, two
# back-to-back triggers (e.g. 1.1 and 2.3 both finishing within a few
# minutes, or a manual dispatch landing during a scheduled run) each
# regenerate the JSON files and race to push. The
# loser then fails its `git pull --rebase` with merge conflicts on
# every changed JSON file. queueing them serially means the later run
# starts from an up-to-date main and re-exports cleanly.
concurrency:
  group: export-and-publish
  cancel-in-progress: false

jobs:
  export:
    # Run on our own schedule/dispatch, or when an upstream succeeded — but NOT
    # when that upstream chain was kicked off by a push to scraper code. The
    # `push` trigger on "1.1 – Daily News Scraper" exists to verify a scraper fix
    # end-to-end; it should not re-publish, re-brief and re-deploy on every commit
    # (that turned a busy dev day into a full-pipeline run every ~15 min). The
    # daily schedule/dispatch path is unaffected, and the 1.3-OI and 2.3-COT
    # workflow_run edges still re-publish (their event is 'workflow_run'/'schedule',
    # not 'push'; a push-origin 1.3 is already skipped upstream so its conclusion
    # isn't 'success'). The Vercel redeploy inherits this skip via
    # their own `conclusion == 'success'` guards.
    if: >-
      ${{ github.event_name != 'workflow_run'
          || (github.event.workflow_run.conclusion == 'success'
              && github.event.workflow_run.event != 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Map each trigger to the slice of topics it actually affects, so a single
      # upstream scraper doesn't force a full 22-topic re-export. cron / manual
      # dispatch / an unrecognised upstream all fall back to a full export.
      # `signals` (which needs `npm ci`) only runs when cot.json can change.
      - name: Decide export scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
        run: |
          topics=""; signals=false
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            signals=true                       # full export + signals
          else
            case "$RUN_NAME" in
              *"COT Scraper"*)        topics="cot,macro_cot,oi_fnd_chart"; signals=true ;;
              *"Daily OI Snapshot"*)  topics="futures_chain,futures_price_history,oi_fnd_chart,latest_prices" ;;
              *"Daily News Scraper"*) topics="news,latest_prices,vn_physical_prices" ;;
              *)                      signals=true ;;   # unknown upstream → full, safe
            esac
          fi
          {
            echo "topics=$topics"
            echo "signals=$signals"
          } >> "$GITHUB_OUTPUT"
          echo "scope: event=$EVENT name='$RUN_NAME' → topics='${topics:-ALL}' signals=$signals"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/scraper/requirements.txt

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.signals == 'true'
        with:
          node-version: '20'

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r scraper/requirements.txt pandas requests python-dotenv openpyxl

      - name: Export static JSON files
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ONLY: ${{ steps.scope.outputs.topics }}
        run: |
          if [ -n "$ONLY" ]; then
            python -m scraper.export_static_json --only "$ONLY"
          else
            python -m scraper.export_static_json
          fi

      # `export:signals` runs a PURE-TypeScript engine (frontend/lib/cot/*)
      # whose import chain is entirely relative — it needs a TS loader and
      # nothing else. This used to `npm ci` the whole app tree (776 MB /
      # 468 packages, ~20 s + 6 s setup-node cache) to obtain one 12 MB tool,
      # for a script that runs in ~1 s. npx fetches tsx into its own cache
      # without touching the project's node_modules. Verified: identical
      # signals.json (19 signals, scoreNY -4, scoreLDN 1) with no project
      # install present. NOTE: `npm i --no-save tsx` does NOT work here — npm
      # installs the full package.json tree alongside it.
      - name: Export rule-based COT signals (signals.json)
        if: steps.scope.outputs.signals == 'true'
        working-directory: frontend
        run: npx --yes tsx@4.22.2 scripts/export-signals.mjs

      # Per-source Telegram text, fired the moment this data lands (replaces the
      # retired 1.6 morning brief). Runs BEFORE the commit so the state file it
      # writes is committed in the same step. Never fails the scraper.
      - name: Telegram — prices, b3, origin_prices, week_ahead
        working-directory: backend
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PYTHONPATH=. python -m scraper.topic_notify_daily prices || true
          PYTHONPATH=. python -m scraper.topic_notify_daily b3 || true
          PYTHONPATH=. python -m scraper.topic_notify_daily origin_prices || true
          PYTHONPATH=. python -m scraper.topic_notify_daily week_ahead || true

      - name: Commit updated static JSON if changed
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # NOTE: oi_history.json is intentionally NOT staged here — it is
          # owned and committed by the Daily OI Snapshot workflow (1.3).
          git add data/topic_notify_state.json \
                   \
                  frontend/public/data/futures_chain.json \
                  frontend/public/data/futures_price_history.json \
                  frontend/public/data/oi_fnd_chart.json \
                  frontend/public/data/cot.json \
                  frontend/public/data/cot_recent.json \
                  frontend/public/data/macro_cot.json \
                  frontend/public/data/freight.json \
                  frontend/public/data/farmer_economics.json \
                  frontend/public/data/farmer_selling_brazil.json \
                  frontend/public/data/health.json \
                  frontend/public/data/latest_prices.json \
                  frontend/public/data/vietnam_supply.json \
                  frontend/public/data/signals.json
          for f in frontend/public/data/vietnam_last.json frontend/public/data/vn_physical_prices.json frontend/public/data/colombia_supply.json frontend/public/data/honduras_supply.json frontend/public/data/indonesia_supply.json frontend/public/data/uganda_supply.json frontend/public/data/ethiopia_supply.json frontend/public/data/demand_stocks.json frontend/public/data/retail_cpi.json frontend/public/data/us_cpi.json frontend/public/data/treasury_yields.json frontend/public/data/brazil_arabica_fisico.json frontend/public/data/brazil_b3_arabica.json frontend/public/data/brazil_b3_conilon.json frontend/public/data/brazil_conilon_vitoria.json frontend/public/data/cepea_conilon_indicator.json frontend/public/data/origin_prices_history.json frontend/public/data/news.json frontend/public/data/countries.json frontend/public/data/factories.json; do
            [ -f "$f" ] && git add "$f" || true
          done

          # Backstop: stage ANY tracked data file the export modified but the
          # allowlist above forgot. `git add -u` touches tracked files only (no
          # untracked strays), and files under frontend/public/data are written
          # solely by export_static_json / export:signals in this job, so
          # anything modified here is canonical exporter output. Without this,
          # a new exporter whose file misses the allowlist regenerates daily
          # but never commits — futures_price_history.json froze for a week
          # that way (Jul 2026) while health.json showed the exporter green.
          # oi_history.json stays excluded: owned + committed by workflow 1.3.
          git add -u frontend/public/data/
          git reset -q frontend/public/data/oi_history.json 2>/dev/null || true
          leftover=$(git status --porcelain frontend/public/data/ | grep -v '^[MARC]' || true)
          [ -n "$leftover" ] && echo "::warning::unstaged data files after backstop: $leftover"

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "data: update static JSON [skip ci]"

          # Rebase strategy — scraper-produced JSON is canonical:
          #
          # The export job runs concurrently with several other workflows
          # that also commit to main (1.3 daily OI snapshot, 2.3 COT scraper,
          # 1.9 quant currency index, etc.). The `concurrency.group` block
          # above queues *this* workflow's runs serially, but it does NOT
          # gate against unrelated workflows pushing between the time we
          # `checkout@v4` and reach the push below — and those other
          # workflows write to the same `frontend/public/data/` files.
          #
          # On conflict, our locally-regenerated JSON is always the right
          # answer: export_static_json.py reads from the DB and produces
          # the exact published shape, so taking our version doesn't lose
          # data — the other workflow's JSON contents were either already
          # in the DB (so our export contains them) or are from a different
          # file we didn't touch (so no conflict).
          #
          # `--strategy-option=theirs` during a rebase keeps the side being
          # replayed (our commit), discarding the rebase-target side (main).
          # Files we didn't `git add` flow through from main unchanged.
          ok=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash --strategy-option=theirs origin "${GITHUB_REF_NAME}" && git push; then ok=1; break; fi
            echo "push attempt $attempt failed (concurrent push?); retrying in $((5*attempt))s…"; sleep $((5 * attempt))
          done
          [ "$ok" = 1 ] || { echo "push failed after 5 attempts"; exit 1; }

      # Phase-3 sunset gate: export_static_json writes a `warnings` entry into
      # health.json when latest_prices/vn_physical_prices had to fall back to
      # NewsItem regex parsing (PhysicalPrice was empty). This runs AFTER the
      # commit on purpose — the fallback output is valid and still publishes —
      # but fails the run (and fires the Telegram notifier) so a fallback never
      # passes silently. A clean green history here is the evidence needed to
      # delete the regex fallback entirely.
      - name: Gate — assert no price regex fallback
        run: |
          HEALTH=frontend/public/data/health.json
          if [ -f "$HEALTH" ] && grep -q "latest_prices_used_regex_fallback" "$HEALTH"; then
            echo "::error::Price export fell back to NewsItem regex (PhysicalPrice empty). Check the price scrapers (vietnam/brazil/uganda/b3_icf/barchart) before sunsetting the regex."
            exit 1
          fi
          echo "OK — structured PhysicalPrice path used (no regex fallback)."

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=🚨 ${{ github.workflow }} failed — $(date -u +'%Y-%m-%d %H:%M UTC') — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
