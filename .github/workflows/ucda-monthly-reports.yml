name: "3.3.6 – Monthly Scraper · UCDA Uganda monthly reports (by-destination)"

# Discovers + downloads + parses UCDA's monthly-report PDFs (4 listing pages
# going back to ~2018) into frontend/public/data/uganda_monthly.json — the
# file behind the Uganda Export-by-Destination chart and the UG-exports
# freshness signal. UCDA's site Cloudflare-blocks GitHub Actions IPs with
# 403, so the scraper uses patchright stealth (same pattern as
# scraper-cecafe-daily.yml).
#
# HISTORY: this began life as the one-shot 'ucda-monthly-backfill' workflow —
# which was in fact the ONLY maintainer of uganda_monthly.json, updated only
# on manual dispatch (last: 2026-06-12). It was then pruned as a "completed
# one-shot" in the 2026-08-04 efficiency pass, leaving the file with no
# updater at all while the freshness panel stayed green. Restored here as a
# proper SCHEDULED monthly job: 16th of each month, 03:00 UTC — two days
# after the DB-side scraper-monthly-uganda run, comfortably inside the
# 40-day scrape threshold the health panel now enforces on this file.
#
# Diagnostic mode (`diag` input) also uploads raw extracted PDF text +
# parsed JSON per report as a workflow artifact, so format drift can be
# inspected and new `_parse_vN` functions designed without re-downloading.

on:
  schedule:
    - cron: '0 3 16 * *'   # 16th of each month, 03:00 UTC
  workflow_dispatch:
    inputs:
      diag:
        description: "Dump raw text + parsed JSON per PDF (artifact)"
        required: false
        default: false
        type: boolean
      max:
        description: "Cap PDFs processed (blank = all). Use small N to iterate parsers."
        required: false
        default: ""
        type: string

concurrency:
  # Own group, not data-commit: a monthly run queued in the shared group gets
  # silently bumped by newer arrivals (how the 2026-07 Uganda DB harvest was
  # lost). The commit step rebases-with-theirs, so it doesn't need the global
  # serialization.
  group: ucda-monthly-reports
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/scraper/requirements.txt

      - name: Install dependencies
        # patchright provides Cloudflare-bypass; pdfplumber extracts PDF text.
        # patchright lives outside the pinned requirements (same pattern as
        # scraper-cecafe-daily.yml) because pip's resolver silently drops it
        # against playwright==1.44.0.
        run: |
          set -e
          pip install requests pdfplumber
          pip install patchright
          python -m patchright install chromium

      - name: Run UCDA scraper (3 attempts, best-effort rc capture)
        id: scrape
        working-directory: backend
        env:
          DIAG: ${{ inputs.diag }}
          MAX:  ${{ inputs.max }}
        run: |
          set +e
          ARGS="--write"
          [ "$DIAG" = "true" ] && ARGS="$ARGS --diag"
          [ -n "$MAX" ] && ARGS="$ARGS --max $MAX"
          rc=1
          for attempt in 1 2 3; do
            PYTHONPATH=. python -m scraper.sources.ucda_monthly $ARGS
            rc=$?
            [ $rc -eq 0 ] && break
            [ $attempt -lt 3 ] && echo "Attempt $attempt exited rc=$rc, retrying in 5m..." && sleep 300
          done
          # Preserve the original contract: the downstream commit-only-on-rc=0
          # guard reads steps.scrape.outputs.rc, so emit the LAST attempt's rc.
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucda-diagnostics
          path: |
            backend/scraper/debug/ucda/
            backend/scraper/cache/ucda/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit updated JSON if changed
        if: steps.scrape.outputs.rc == '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f frontend/public/data/uganda_monthly.json ]; then
            git add frontend/public/data/uganda_monthly.json
            if git diff --cached --quiet; then
              echo "No JSON change."
            else
              CURRENT=$(git rev-parse --abbrev-ref HEAD)
              git commit -m "data: UCDA monthly reports update $(date -u +%Y-%m-%d) [skip ci]"
              if [ "$CURRENT" = "main" ]; then
                git pull --rebase --autostash --strategy-option=theirs origin main
                git push
              else
                git push origin "HEAD:$CURRENT"
              fi
            fi
          fi

      - name: Notify on failure or cancellation
        # cancelled() included: a bumped monthly run must never again be a
        # silent month-long data gap.
        if: failure() || cancelled()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=🚨 ${{ github.workflow }} ${{ job.status }} — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
