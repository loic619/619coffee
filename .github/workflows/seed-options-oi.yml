name: "Z – Seed: options OI snapshot (manual)"

# One-off/manual: run the options-board fetch outside the 1.3 daily cadence
# (e.g. to seed the first snapshot, or recover after a quiet failure) and
# commit options_oi.json. No weekend gate — Barchart serves the latest
# session's board at any time.

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}
      - name: Install dependencies
        run: |
          pip install playwright
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* || true
          playwright install chromium --with-deps || playwright install chromium
      - name: Fetch options board
        env:
          PYTHONPATH: backend
        run: python backend/scraper/fetch_options_json.py
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/options_oi.json
          [ -f data/options_boards_archive.json ] && git add data/options_boards_archive.json || true
          [ -f frontend/public/data/options_strike_history.json ] && git add frontend/public/data/options_strike_history.json || true
          if git diff --cached --quiet; then echo "No changes."; else
            git commit -m "data: options OI snapshot [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
              sleep $((RANDOM % 5 + 3))
            done
            echo "::error::push failed"; exit 1
          fi
