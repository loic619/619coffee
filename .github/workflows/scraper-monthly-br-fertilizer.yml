name: "3.3.2 – Monthly Scraper · Brazil Fertilizer (Comex)"

on:
  # Primary trigger is '1.17 - Source Sentinel', which watches the MDIC Comex
  # CSV and dispatches this workflow on publication day.
  #
  # The cron below is a SAFETY NET, restored 2026-08-30 — see the sibling note
  # in scraper-monthly-conab.yml. Same failure: detection has never fired
  # (`comex` sentinel state is last_found: null, signal: null,
  # confirmed: "2026-07"), so fertilizer_comex went 48 days stale. Here the
  # sentinel was explicit about it, posting "MDIC Comex bulk import CSV: still
  # undetected 21d past its window — the probe pattern may be broken; run the
  # scraper manually". That instruction should not need a human.
  #
  # Offset an hour from CONAB's so two Playwright-class jobs do not contend.
  schedule:
    - cron: '37 7 12 * *'
    - cron: '37 7 20 * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/scraper/requirements.txt

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r scraper/requirements.txt pandas requests python-dotenv openpyxl xlrd

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Playwright browser
        run: sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* || true; playwright install chromium --with-deps || playwright install chromium

      - name: Run Comex fertilizer scraper (3 attempts)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          for attempt in 1 2 3; do
            python -m scraper.run_monthly comex && break
            [ $attempt -lt 3 ] && echo "Attempt $attempt failed, retrying in 5m..." && sleep 300 || exit 1
          done

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=🚨 ${{ github.workflow }} failed — $(date -u +'%Y-%m-%d %H:%M UTC') — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
