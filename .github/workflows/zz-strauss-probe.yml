name: Z.95 – Strauss report probe (temporary)

# Is there a coffee VOLUME figure in Strauss's reports at all?
#
# Unlike Nestle and JDE, who both publish a volume/price split by policy, this
# is an open question: Strauss may report only revenue, in which case there is
# nothing to track and the honest answer is to say so rather than surface a
# revenue line dressed up as demand.
#
# Complications this probe has to settle:
#   - the reports are in Hebrew, and pdfplumber often returns RTL text reversed
#   - some Israeli filings are image-only scans, with no text layer at all
#   - Strauss's Brazil coffee business (Tres Coracoes) is a JV, so it may be
#     equity-accounted and absent from the consolidated segment tables

on:
  workflow_dispatch:
  push:
    branches: [demand-earnings-revamp]
    paths: [".github/workflows/zz-strauss-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests pdfplumber
      - name: Fetch and inspect
        timeout-minutes: 12
        run: |
          python - <<'PY'
          import io, re, sys, time, requests, pdfplumber

          # Print as we go and flush: the first version buffered everything per
          # document, so when it stalled on a large filing it produced nothing
          # at all and told us only that it was slow.
          def say(*a):
              print(*a); sys.stdout.flush()

          UA=("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
              "(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36")
          H={"User-Agent":UA,"Accept-Language":"en-US,en;q=0.9"}
          DOCS={
            "Q2-2026": "https://ir.strauss-group.com/wp-content/uploads/2026/08/P1762866-00.pdf",
            "Q1-2026": "https://ir.strauss-group.com/wp-content/uploads/2026/07/Q1-2026-STRS.pdf",
            "FY-2025": "https://ir.strauss-group.com/wp-content/uploads/2024/08/FY2025-report.pdf",
            "Q3-2025": "https://ir.strauss-group.com/wp-content/uploads/2024/08/Reporting_Package_Q3_2025.pdf",
          }
          COFFEE = ("קפה", "הפק", "offee", "Cora")
          BRAZIL = ("ברזיל", "ליזרב", "razil")
          VOLUME = ("כמות", "טונ", "olume", "tonne", "Tons", "tons")

          MAX_PAGES = 90     # segment discussion sits early; the tail is notes.

          for label,url in DOCS.items():
              say(f"\n=== {label}  {url.rsplit('/',1)[-1]}")
              t0=time.time()
              try:
                  r=requests.get(url,headers=H,timeout=120)
              except Exception as e:
                  say(f"    fetch EXC {type(e).__name__}"); continue
              if not r.ok or b"%PDF" not in r.content[:2048]:
                  say(f"    HTTP {r.status_code}, not a PDF ({len(r.content)} bytes)"); continue
              say(f"    HTTP 200  {len(r.content)/1e6:.1f} MB  ({time.time()-t0:.0f}s)")
              try:
                  with pdfplumber.open(io.BytesIO(r.content)) as pdf:
                      n=len(pdf.pages)
                      say(f"    pages={n}, scanning first {min(n,MAX_PAGES)}")
                      chars=0; cof=bra=vol=0; interesting=[]
                      for i,pg in enumerate(pdf.pages[:MAX_PAGES],1):
                          try: t=pg.extract_text() or ""
                          except Exception: t=""
                          chars+=len(t)
                          c=any(k in t for k in COFFEE)
                          b=any(k in t for k in BRAZIL)
                          v=any(k in t for k in VOLUME)
                          cof+=c; bra+=b; vol+=v
                          if c and v:
                              interesting.append(i)
                          if i % 30 == 0:
                              say(f"      ...p{i} chars so far={chars}")
                      say(f"    text chars (first {min(n,MAX_PAGES)} pp) = {chars}")
                      if chars < 500:
                          say("    -> NO TEXT LAYER — image-only scan"); continue
                      say(f"    pages mentioning: coffee={cof} brazil={bra} volume-word={vol}")
                      say(f"    coffee+volume on pages: {interesting[:12]}")
                      for i in interesting[:3]:
                          t=pdf.pages[i-1].extract_text() or ""
                          lines=[l.strip() for l in t.splitlines()
                                 if any(k in l for k in COFFEE+VOLUME) and re.search(r"\d", l)]
                          say(f"      --- p{i} sample lines ---")
                          for l in lines[:6]: say(f"        {l[:150]}")
              except Exception as e:
                  say(f"    parse EXC {type(e).__name__}: {e}")
          PY
