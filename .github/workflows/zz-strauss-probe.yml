name: Z.95 – Strauss report probe (temporary)

# Is there a coffee VOLUME figure in Strauss's reports at all?
#
# Unlike Nestle and JDE, who both publish a volume/price split by policy, this
# is an open question: Strauss may report only revenue, in which case there is
# nothing to track and the honest answer is to say so rather than surface a
# revenue line dressed up as demand.
#
# Complications this probe has to settle:
#   - the reports are in Hebrew, and pdfplumber often returns RTL text reversed
#   - some Israeli filings are image-only scans, with no text layer at all
#   - Strauss's Brazil coffee business (Tres Coracoes) is a JV, so it may be
#     equity-accounted and absent from the consolidated segment tables

on:
  workflow_dispatch:
  push:
    branches: [demand-earnings-revamp]
    paths: [".github/workflows/zz-strauss-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests pdfplumber
      - name: Fetch and inspect
        timeout-minutes: 12
        run: |
          python - <<'PY'
          import io, re, sys, requests, pdfplumber
          def say(*a): print(*a); sys.stdout.flush()

          UA=("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
              "(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36")
          H={"User-Agent":UA}
          DOCS={
            "Q2-2026": "https://ir.strauss-group.com/wp-content/uploads/2026/08/P1762866-00.pdf",
            "FY-2025": "https://ir.strauss-group.com/wp-content/uploads/2024/08/FY2025-report.pdf",
          }
          COFFEE = ("קפה", "הפק", "offee", "Cora")
          # Wider net. The first pass used only "quantity" and "tonne" and found
          # nothing; these are the other ordinary Hebrew words for volume/scope,
          # plus their reversed forms in case any page extracts RTL-flipped.
          VOL_WIDE = ("כמות","תומכ", "טונ","נוט", "היקף","ףקיה", "נפח","חפנ",
                      "מכירות","תוריכמ", "olume","onnes","Tons","tons","units")
          say("wide volume vocabulary:", VOL_WIDE)

          for label,url in DOCS.items():
              say(f"\n=== {label}")
              r=requests.get(url,headers=H,timeout=120)
              with pdfplumber.open(io.BytesIO(r.content)) as pdf:
                  pages=pdf.pages[:110]
                  cof_pages=[]
                  for i,pg in enumerate(pages,1):
                      t=pg.extract_text() or ""
                      if any(k in t for k in COFFEE):
                          score=sum(t.count(k) for k in COFFEE)
                          cof_pages.append((score,i,t))
                  cof_pages.sort(reverse=True)
                  say(f"  coffee pages: {len(cof_pages)}; densest: {[p[1] for p in cof_pages[:6]]}")
                  hits=0
                  for score,i,t in cof_pages:
                      found=[k for k in VOL_WIDE if k in t]
                      if not found: continue
                      hits+=1
                      say(f"  --- p{i} (coffee x{score}) volume-words {found} ---")
                      for line in t.splitlines():
                          if any(k in line for k in VOL_WIDE) and re.search(r"\d", line):
                              say(f"      {line.strip()[:160]}")
                      if hits>=4: break
                  if not hits: say("  NO volume vocabulary on ANY coffee page")
                  # Show the densest coffee page verbatim, to see what they DO report.
                  if cof_pages:
                      _,i,t=cof_pages[0]
                      say(f"\n  ### densest coffee page p{i}, first 1400 chars:")
                      say(t[:1400])
          PY
