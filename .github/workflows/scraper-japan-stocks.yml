name: "3.5 – AJCA (Japan)"

# Builds frontend/public/data/ajca.json from AJCA's monthly
# "コーヒー豆在庫実績調査" (j-zaiko) reports: green-coffee stocks by origin and
# by region/port, monthly. Runs on a GitHub runner because ajca.or.jp is
# reachable there (the Claude sandbox is host-allowlist blocked).

on:
  schedule:
    # Weekly (Sun 05:07 UTC, off the :00 mark per repo cron convention). AJCA
    # posts a month's PDFs at an unpredictable point ~5–9 weeks after the
    # period; the old monthly-on-the-6th cron could ingest a fresh PDF up to
    # ~5 weeks late. Weekly caps that lag at 7 days — one HTML page + one PDF
    # per run, so the extra runs are negligible.
    - cron: "7 5 * * 0"
  workflow_dispatch:
    inputs:
      debug:
        description: "Also write ajca_debug.json"
        type: boolean
        default: false

# Own lane — NOT the shared `data-commit` group.
#
# 25 workflows used to sit in that one group. GitHub's concurrency model only
# protects the RUNNING member: `cancel-in-progress: false` keeps the in-progress
# run alive, but the queue holds exactly ONE pending run, so whenever a third
# member arrives the one already waiting is CANCELLED outright — its scraped
# data thrown away before it ever ran. Observed 2026-08-14 on 1.3 Daily OI:
# three cancelled runs in one morning, one of them killed after 31 minutes.
# 1.16 hit the same thing and was given its own lane in August for exactly this
# reason; this generalises that fix.
#
# Serialising the push is what the shared group was really buying, and that is
# now handled properly by .github/actions/commit-data, which re-syncs with
# origin/main and retries with backoff on every attempt.
concurrency:
  group: scraper-japan-stocks
  cancel-in-progress: false

jobs:
  japan-stocks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: backend/scraper/requirements.txt
      - name: Install dependencies
        run: pip install requests pdfplumber

      - name: Run Japan stocks backfill (3 attempts)
        working-directory: backend
        run: |
          run_scraper() {
            if [ "${{ inputs.debug }}" = "true" ]; then
              python -m scraper.backfill_japan_stocks --debug
            else
              python -m scraper.backfill_japan_stocks
            fi
          }
          for attempt in 1 2 3; do
            run_scraper && break
            [ $attempt -lt 3 ] && echo "Attempt $attempt failed, retrying in 5m..." && sleep 300 || exit 1
          done

      - name: Upload debug artifact
        if: ${{ inputs.debug }}
        uses: actions/upload-artifact@v4
        with:
          name: ajca-debug
          path: frontend/public/data/ajca_debug.json
          if-no-files-found: ignore

      - name: Commit japan_stocks.json if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f frontend/public/data/ajca_debug.json
          git add frontend/public/data/ajca.json
          git diff --cached --quiet \
            && echo "No changes." \
            || (git commit -m "data: update ajca.json [skip ci]" && git pull --rebase --autostash --strategy-option=theirs origin main && git push)

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=🚨 ${{ github.workflow }} failed — $(date -u +'%Y-%m-%d %H:%M UTC') — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
