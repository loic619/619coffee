name: "Z – Probe: CCI inputs (diagnostic)"

# Temporary probes carry the Z prefix rather than a number: they are
# deleted once they have answered their question, and 0.9 is title-locked
# by the VN Customs workflow that source-sentinel listens for.

# Manual diagnostic, no schedule. The dev sandbox's egress proxy denies both
# cdn.jsdelivr.net and apps.fas.usda.gov, so the only way to establish whether
# HNL/UGX/ETB are publishable CCI components — and to recompute all eight
# exporter weights from ONE PSD pull — is to ask from a runner.
# Delete this workflow once the weights are set.

on:
  workflow_dispatch:

concurrency:
  group: probe-cci-inputs
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet requests
      - name: Probe
        working-directory: backend
        run: python scripts/probe_cci_inputs.py
