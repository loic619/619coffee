name: "0.19 – Record an ICE publish time (operator backfill)"

# The robusta stock CSV is served under an HHMMSS-stamped URL with no index, and
# the sweep deliberately covers only 10:29–11:00 — 97% of sessions, bought at a
# 96-minute worst case instead of nine hours. A report published outside that
# window is announced on Telegram and listed as pending on the Admin research
# page, because the one thing that recovers it is a human supplying the second.
#
# This is the other half of that loop. Given a date and the second, it appends
# the observation to the hit log and re-runs the scraper, whose tier 0 then
# fetches the session in a single request — retention is confirmed, so age does
# not matter (probe 0.18: June reports still served in late August).
#
# Given a date and NO second, it records the other reason a day can be empty:
# ICE published nothing at all. 2026-08-31 was the UK summer bank holiday — the
# sweep walked the full window because there was nothing to find, and no second
# will ever close that day. Passing it files the reason and takes it off the
# pending list instead of leaving a permanent to-do there.
#
# Dispatched from the research page via /api/admin/ice-publish-time, or by hand.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Session date, YYYY-MM-DD"
        required: true
        type: string
      hhmmss:
        description: "Publish time as in the filename, e.g. 112351. Leave empty to pass the day."
        required: false
        type: string
      reason:
        description: "Why there was no release — only read when hhmmss is empty"
        required: false
        type: string

concurrency:
  group: scraper-ice-certified-stocks   # shares 1.13's lane — same host
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: backend
        run: pip install --quiet -r scraper/requirements.txt

      - name: Record the observation
        working-directory: backend
        env:
          IN_DATE: ${{ inputs.date }}
          IN_TIME: ${{ inputs.hhmmss }}
          IN_REASON: ${{ inputs.reason }}
        # Not a heredoc: the rules here (a date is in at most one of the two
        # files; a day with a known second cannot be passed; a second withdraws
        # an earlier pass) are the part worth testing, and nothing tests YAML.
        run: |
          PYTHONPATH=. python -m scraper.sources.ice_certified_stocks.record_observation \
            --date "$IN_DATE" --hhmmss "$IN_TIME" --reason "$IN_REASON"

      # Nothing to fetch for a passed day — there was no report.
      - name: Backfill the session
        if: ${{ inputs.hhmmss != '' }}
        working-directory: backend
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # --days 3 keeps the run short: the recovery list comes from the hit
        # log, not the window, so the newly-recorded day is picked up regardless
        # of how old it is.
        run: PYTHONPATH=. python -m scraper.sources.ice_certified_stocks.orchestrate --days 3 --skip-monthly

      - name: Republish the research payload
        working-directory: backend
        run: PYTHONPATH=. python -m scraper.exporters.ice_publish_times || true

      - name: Commit
        # Inputs go through the environment, never interpolated into the script:
        # `reason` is free text typed by an operator, and `${{ }}` in a run block
        # would make it shell.
        env:
          IN_DATE: ${{ inputs.date }}
          IN_TIME: ${{ inputs.hhmmss }}
          IN_REASON: ${{ inputs.reason }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in frontend/public/data/certified_stocks_arabica.json \
                   frontend/public/data/certified_stocks_robusta.json \
                   frontend/public/data/ice_publish_times.json \
                   frontend/public/data/run_degradations.json \
                   backend/scraper/sources/ice_certified_stocks/stock_report_hits.json \
                   backend/scraper/sources/ice_certified_stocks/no_release_days.json \
                   backend/scraper/sources/ice_certified_stocks/stock_report_cursor.json \
                   backend/scraper/sources/ice_certified_stocks/ice_run_stats.json; do
            [ -f "$f" ] && git add "$f"
          done
          true
          if [ -n "$IN_TIME" ]; then
            MSG="data: ICE robusta backfill $IN_DATE @ $IN_TIME [skip ci]"
            NOOP="Nothing changed — the session may not be recoverable at that second."
          else
            MSG="data: ICE no release on $IN_DATE — $IN_REASON [skip ci]"
            NOOP="Nothing changed — $IN_DATE was already recorded as a no-release day."
          fi
          git diff --cached --quiet \
            && echo "$NOOP" \
            || (git commit -m "$MSG" \
                && git pull --rebase --autostash --strategy-option=theirs origin "${GITHUB_REF_NAME}" \
                && git push origin "HEAD:${GITHUB_REF_NAME}")
