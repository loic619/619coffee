name: "1.14 – ICE Monthly Reports (arabica ageing + robusta age-allowance)"

# Monthly-only ICE pull: the C-contract ageing report
#   https://www.ice.com/publicdocs/futures_us_reports/coffee/coffee_aging_YYYYMMDD.xls
# and the robusta age-allowance report. These publish once a month, so the
# daily scraper (1.13) runs with --skip-monthly and this job owns them.
#
# Runs --only-monthly: it skips the daily feeds + the ~10-min robusta stock
# sweep, fetching just the two monthly reports (each run is cheap). The merge
# preserves the daily snapshots, and the exporter/commit only fires when the
# numbers actually change — so the early-month catch window is a no-op once the
# fresh report is captured.

on:
  workflow_dispatch:
    inputs:
      days_back:
        description: "Backfill window in business days (small — the merge keeps history)"
        required: false
        default: "3"
        type: string
  schedule:
    # Self-terminating catch window. Fires the 1st, 2nd, 3rd at 14:00 UTC, but
    # the "already captured?" guard below turns every run after the report lands
    # into an instant no-op — so in practice it runs once (the 1st) and stops.
    # The 1st targets the previous month-end (orchestrate's candidate-date logic
    # walks 31→30→29 for weekend month-ends within that single run); if the file
    # isn't published yet the 2nd retries, then the 3rd. After the 3rd we give
    # up — the per-feed freshness monitor then raises the red alert to handle.
    # 1st-3rd catches the age-allowance/ageing publish; 5/8/11 are retries for
    # late publishes (the monthly iss/recv file has appeared mid-month, and the
    # Aug-2026 miss showed the early window alone is fragile). The guard below
    # makes already-captured runs a no-op, so the extra crons are cheap.
    - cron: '0 14 1-3,5,8,11 * *'

# Own lane — NOT the shared `data-commit` group.
#
# 25 workflows used to sit in that one group. GitHub's concurrency model only
# protects the RUNNING member: `cancel-in-progress: false` keeps the in-progress
# run alive, but the queue holds exactly ONE pending run, so whenever a third
# member arrives the one already waiting is CANCELLED outright — its scraped
# data thrown away before it ever ran. Observed 2026-08-14 on 1.3 Daily OI:
# three cancelled runs in one morning, one of them killed after 31 minutes.
# 1.16 hit the same thing and was given its own lane in August for exactly this
# reason; this generalises that fix.
#
# Serialising the push is what the shared group was really buying, and that is
# now handled properly by .github/actions/commit-data, which re-syncs with
# origin/main and retries with backoff on every attempt.
concurrency:
  group: scraper-ice-monthly-reports
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Guard: stop once the PREVIOUS month's reports are already in the JSON.
      # On the 1st-5th the target is last month; if both the arabica ageing and
      # robusta age-allowance month_end already sit in that month, skip the
      # fetch + commit (a ~10-second no-op). This is how the schedule "stops
      # until next month" — cron can't be cancelled, but captured runs do nothing.
      # workflow_dispatch always proceeds (no guard) for manual catch-up.
      - name: Already captured this month?
        id: guard
        run: |
          python - <<'PY'
          import json, os, datetime
          today = datetime.date.today()
          prev = (today.replace(day=1) - datetime.timedelta(days=1)).strftime("%Y-%m")
          try:
              a = json.load(open("frontend/public/data/certified_stocks_arabica.json"))
              r = json.load(open("frontend/public/data/certified_stocks_robusta.json"))
              a_me = ((a.get("ageing_report") or {}).get("month_end") or "")[:7]
              aa = (r.get("monthly") or {}).get("age_allowance") or []
              r_me = ((aa[-1].get("month_end") if aa else "") or "")[:7]
              ir = (r.get("monthly") or {}).get("iss_recv_monthly") or []
              r_ir = ((ir[-1].get("month") if ir else "") or "")[:7]
          except Exception as e:
              a_me = r_me = r_ir = ""
              print(f"guard read error (will fetch): {e}")
          # ALL monthly feeds must carry the target month before we skip —
          # age-allowance landing early must not stop retries for the late
          # iss/recv file (stuck at 2026-05 through July for exactly this).
          done = (a_me == prev) and (r_me == prev) and (r_ir == prev)
          print(f"target month={prev} · arabica ageing={a_me!r} · robusta age-allowance={r_me!r} · iss/recv={r_ir!r} · already_captured={done}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"done={'true' if done else 'false'}\n")
          PY

      - name: Install dependencies
        if: ${{ github.event_name == 'workflow_dispatch' || steps.guard.outputs.done != 'true' }}
        # sqlalchemy / psycopg2-binary / python-dotenv / jinja2 match workflow
        # 1.13 — the orchestrator's tail step imports scraper.db (news_emit) at
        # write time even on a monthly-only run.
        run: pip install requests 'xlrd<2.0' openpyxl pdfplumber sqlalchemy psycopg2-binary python-dotenv jinja2

      - name: Pull ICE monthly reports (--only-monthly, fail fast on a block)
        id: pull
        if: ${{ github.event_name == 'workflow_dispatch' || steps.guard.outputs.done != 'true' }}
        working-directory: backend
        env:
          PYTHONUNBUFFERED: "1"
          # A 403 skips a fetch section and lets the run finish green, so the
          # orchestrator says so on Telegram itself — the step-level failure
          # notifier below never fires for it.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Exit 3 = the feed refused EVERY request. That is a per-IP block on
          # this runner, not a transient fault: the orchestrator says so in the
          # same breath ("changing the request interval will not clear it"),
          # and a retry can only pay the whole run again from the same IP.
          #
          # Run 33978343636 did exactly that. Three attempts, 5 minutes apart,
          # 26 refusals each, three identical Telegram messages and 14 minutes
          # of runner time to re-learn what request one had already proved.
          # 1.13 was given this fast path in #838; this job never got it.
          #
          # `orchestrate || rc=$?` rather than `if orchestrate; then break; fi`
          # followed by `rc=$?`: under `set -e` the bare call would kill the
          # step, and after an if/fi with no else `$?` is the IF's status
          # (always 0), not the command's — which is why 1.13's own exit-3
          # check never fired either. Fixed there in the same commit.
          for attempt in 1 2; do
            rc=0
            python -m scraper.sources.ice_certified_stocks.orchestrate \
              --days "${{ inputs.days_back || 3 }}" --only-monthly || rc=$?
            [ "$rc" -eq 0 ] && break
            if [ "$rc" -eq 3 ]; then
              echo "ICE refused every request (exit 3) — a retry cannot clear a per-IP block."
              # Tells the failure notifier below to stay quiet: the orchestrator
              # has already sent a BLOCKED message naming the sections, and a
              # generic "failed" line on top of it says a different thing about
              # the same event.
              echo "ice_blocked=true" >> "$GITHUB_OUTPUT"
              exit 3
            fi
            [ $attempt -lt 2 ] && echo "Attempt $attempt failed, retrying in 60s..." && sleep 60 || exit 1
          done

      - name: Commit + push if changed
        if: ${{ github.event_name == 'workflow_dispatch' || steps.guard.outputs.done != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/certified_stocks_arabica.json \
                  frontend/public/data/certified_stocks_robusta.json \
                  frontend/public/data/run_degradations.json \
                  data/ice_block_state.json
          git diff --cached --quiet \
            && echo "No changes." \
            || (git commit -m "data: ICE monthly reports (ageing + age-allowance) [skip ci]" \
                && git pull --rebase --autostash --strategy-option=theirs origin "${GITHUB_REF_NAME}" \
                && git push origin "HEAD:${GITHUB_REF_NAME}")

      # The observability record has to survive the failure it is about.
      #
      # #844 added run_degradations.json so a skipped section shows on the data
      # map, and ice_block_state.json is what keeps the alert edge-triggered.
      # Both are written by a blocked run — and both were then thrown away,
      # because the commit step above is skipped when the scraper step fails.
      # run_degradations.json is empty on main today for exactly that reason.
      #
      # Deliberately NOT committing the two certified_stocks JSONs here. They
      # carry a `generated_at` stamp that moves on every write, so committing
      # them from a blocked run would advance a freshness marker on a run that
      # captured nothing — the precise thing this whole change exists to stop.
      # The snapshot data itself is unchanged (the merge preserves it), so
      # nothing is lost by leaving them out.
      #
      # `if: failure()` does not mask the failure: a step that succeeds after a
      # failed one cannot return the job to green. The job still fails, and the
      # record of why now survives it.
      - name: Persist the degradation record (blocked run)
        if: failure()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in frontend/public/data/run_degradations.json data/ice_block_state.json; do
            [ -f "$f" ] && git add "$f"
          done
          true
          git diff --cached --quiet \
            && echo "Nothing to record." \
            || (git commit -m "data: ICE block record [skip ci]" \
                && git pull --rebase --autostash --strategy-option=theirs origin "${GITHUB_REF_NAME}" \
                && git push origin "HEAD:${GITHUB_REF_NAME}") || true

      # Gated on the block flag: a wholly-refused run has ALREADY sent a
      # BLOCKED message naming the sections and the totals. Adding a bare
      # "failed" line on top of it describes the same event twice, in two
      # different vocabularies — which is how run 33978343636 read as both a
      # green degradation and a failure.
      - name: Notify on failure
        if: ${{ failure() && steps.pull.outputs.ice_blocked != 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=🚨 ${{ github.workflow }} failed — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
