name: "0.29 – Probe FBX history, second pass (diagnostic)"

# Dispatch-only. 0.28 found no series endpoint on the lane pages, but it never
# watched the network on fbx.freightos.com and its response filter could have
# dropped a series served without a JSON content-type. This pass captures every
# response on every page, scrolls to trigger lazily-mounted chart widgets, and
# reports whether a chart element exists at all — so "no history available" can
# be stated as a finding rather than inferred from a missing request.
# Writes nothing and commits nothing.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install playwright

      - name: Install Playwright browser
        run: sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* || true; playwright install chromium --with-deps || playwright install chromium

      - name: Probe FBX history, second pass
        working-directory: backend
        run: python -m scraper.probe_fbx_history2
