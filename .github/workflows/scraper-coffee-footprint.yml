name: "1.25 – Coffee Footprint (MapBiomas raster)"

# Derives where coffee actually sits from MapBiomas' 30 m raster, as a density
# grid. Streams windows from a Cloud-Optimised GeoTIFF rather than downloading
# the ~1 GB national mosaic, but it is still the heaviest job here — hence
# yearly, matching the collection cadence, plus manual dispatch.

on:
  schedule:
    - cron: '43 5 8 9 *'
  workflow_dispatch:

concurrency:
  group: scraper-coffee-footprint
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests rasterio numpy

      - name: Export coffee footprint
        working-directory: backend
        run: python -m scraper.run_coffee_footprint

      - name: Commit coffee footprint if changed
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/coffee_footprint.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "data: update coffee footprint (MapBiomas raster) [skip ci]"
          ok=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash --strategy-option=theirs origin "${GITHUB_REF_NAME}" && git push; then ok=1; break; fi
            echo "push attempt $attempt failed; retrying in $((5*attempt))s…"; sleep $((5 * attempt))
          done
          [ "$ok" = 1 ] || { echo "push failed after 5 attempts"; exit 1; }

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=🚨 ${{ github.workflow }} failed — $(date -u +'%Y-%m-%d %H:%M UTC') — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
