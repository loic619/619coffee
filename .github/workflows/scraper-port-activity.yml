name: "1.11 – Port Activity Scraper (PortWatch)"

on:
  schedule:
    # IMF PortWatch refreshes weekly on Tuesdays ~09:00 ET (13:00–14:00 UTC).
    # Run Wednesday 06:17 UTC so the latest week is published. 17 to dodge the
    # GH cron skip on :00 marks.
    - cron: '17 6 * * 3'
  workflow_dispatch:      # allow manual trigger from the GitHub UI

# Serialize with other workflows that push frontend/public/data on main.
concurrency:
  group: scraper-port-activity
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # The scrape step retries up to 3× with 5-min sleeps between attempts, so a
    # slow-source week needs ~2×5min sleeps + 3 scrapes. 15 min killed those runs
    # mid-retry (they surfaced as a confusing "cancelled", froze port_activity —
    # e.g. 2026-07-29 ran 15.3 min then timed out). 30 min lets all 3 attempts
    # complete so a genuine source outage fails cleanly instead of timing out.
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests

      # Exit codes: 0 = all ports fetched, 2 = data written but some port has no
      # data at all, 1 = nothing written (retryable). Exit 2 must NOT abort the
      # job here — the data we did get still needs committing; the gate step at
      # the end fails the run instead.
      - name: Run PortWatch port-activity scraper (3 attempts)
        id: scrape
        working-directory: backend
        run: |
          for attempt in 1 2 3; do
            python -m scraper.run_port_activity; rc=$?
            if [ $rc -eq 0 ] || [ $rc -eq 2 ]; then
              echo "incomplete=$([ $rc -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ $attempt -lt 3 ] && echo "Attempt $attempt failed, retrying in 5m..." && sleep 300 || exit 1
          done

      - name: Commit updated port activity if changed
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -A stages new, modified, and removed per-port files (and index.json).
          git add -A frontend/public/data/port_activity
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "data: update port activity (PortWatch) [skip ci]"
          # Other workflows also push to main between checkout and push; rebase
          # and retry. Our regenerated JSON is canonical for this file.
          ok=0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash --strategy-option=theirs origin "${GITHUB_REF_NAME}" && git push; then ok=1; break; fi
            echo "push attempt $attempt failed (concurrent push?); retrying in $((5*attempt))s…"; sleep $((5 * attempt))
          done
          [ "$ok" = 1 ] || { echo "push failed after 5 attempts"; exit 1; }

      # Runs after the commit so partial data still publishes, but a port that
      # produced nothing at all (bad match string / dead portid) still fails the
      # run and alerts, rather than silently disappearing from the site.
      - name: Gate — every configured port has data
        if: steps.scrape.outputs.incomplete == 'true'
        run: |
          echo "::error::A configured port produced no data — see the scraper log for which."
          exit 1

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=🚨 ${{ github.workflow }} failed — $(date -u +'%Y-%m-%d %H:%M UTC') — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
