name: "1.7 – Cecafe Daily Registration"

on:
  schedule:
    # TWO daily windows. The LATE window (17:00 UTC = 14:00 Brasília) is the
    # primary catch — Cecafé publishes the day's resumo at a variable hour,
    # often only by afternoon Brasília time. The EARLY window (02:00 UTC =
    # 23:00 prior-day Brasília) is a pre-brief catch — Cecafé sometimes
    # publishes late-evening Brazil time, and without an early run the
    # 03:09 UTC morning brief inherits whatever stale page state the prior
    # afternoon's scrape captured (observed 2026-06-26: brief shipped
    # 2-day-old Brazil reg data because Thu's data hadn't published by the
    # Thu 17:00 UTC scrape).
    #
    # History: this used to be three windows (09/13/17 UTC) as a hedge
    # against Cecafe's edge refusing GH Actions IPs for 30+ min stretches.
    # The patchright browser-render path (added June 2026) cleared the
    # bot-challenge wall reliably, so the extra windows became redundant
    # cost; we trimmed to one. Re-adding ONE morning window (not three)
    # gives us pre-brief freshness without re-burning the cost of the
    # afternoon retries. workflow_dispatch stays for manual catch-up.
    - cron: '0 2 * * *'    # early — pre-brief catch (late-Brazil-evening publishes)
    - cron: '0 17 * * *'   # late  — primary Cecafé-close window
  workflow_dispatch:

# Own lane — NOT the shared `data-commit` group.
#
# 25 workflows used to sit in that one group. GitHub's concurrency model only
# protects the RUNNING member: `cancel-in-progress: false` keeps the in-progress
# run alive, but the queue holds exactly ONE pending run, so whenever a third
# member arrives the one already waiting is CANCELLED outright — its scraped
# data thrown away before it ever ran. Observed 2026-08-14 on 1.3 Daily OI:
# three cancelled runs in one morning, one of them killed after 31 minutes.
# 1.16 hit the same thing and was given its own lane in August for exactly this
# reason; this generalises that fix.
#
# Serialising the push is what the shared group was really buying, and that is
# now handled properly by .github/actions/commit-data, which re-syncs with
# origin/main and retries with backoff on every attempt.
concurrency:
  group: scraper-cecafe-daily
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 3 attempts × (≤60s request + ≤45s patchright render) + 60s + 240s gaps
    # ≈ 12 min worst case. Chromium install adds ~1 min. 20 min leaves
    # headroom, still well under the original single-window 25min cap.
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/scraper/requirements.txt

      - name: Install dependencies
        # requests for the fast-path fetch; pdfplumber for the PDF mirror
        # fallback. patchright (Cloudflare-evading Playwright fork) renders
        # past the bot-challenge wall Cecafé's edge began serving to GH
        # Actions IPs in June 2026 — same proven bypass scraper-daily.yml
        # uses for giacaphe.com. Installed explicitly (not via requirements)
        # because pip's resolver silently drops it against playwright==1.44.0.
        run: |
          set -e
          pip install pdfplumber requests
          pip install patchright
          python -m patchright install chromium

      - name: Run Cecafe scraper (3 attempts within the daily window)
        working-directory: backend
        # 3 in-run attempts with 60s/240s spacing. Now that there's a single
        # daily window (no 13:00/17:00 backups), these within-run retries are
        # the only safety net for a transient blip — patchright clears the
        # challenge on the first try in the normal case, so the retries
        # mostly cover a one-off network hiccup. The run is idempotent: a
        # page that hasn't advanced to a new day commits nothing.
        run: |
          set +e
          for attempt in 1 2 3; do
            python -m scraper.fetch_cecafe_daily
            rc=$?
            [ $rc -eq 0 ] && exit 0
            if [ $attempt -lt 3 ]; then
              sleep_for=$((60 * attempt * attempt))   # 60, 240, ...
              echo "Attempt $attempt failed (rc=$rc); retrying in ${sleep_for}s..."
              sleep $sleep_for
            fi
          done
          echo "All 3 attempts failed within this cron window — next scheduled cron will retry."
          exit 1

      - name: Upload fetched page (diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cecafe-daily-page
          path: debug/*.html
          if-no-files-found: warn
          retention-days: 14

      - name: Validate output
        run: |
          python -c "
          import json, sys, subprocess
          sys.path.insert(0, 'backend')
          from scraper.validate_export import validate_cecafe_daily
          data = json.load(open('frontend/public/data/cecafe_daily.json'))
          ok, reason = validate_cecafe_daily(data)
          if not ok:
              print(f'[validate] cecafe_daily.json FAILED: {reason} — restoring HEAD version')
              subprocess.run(['git', 'checkout', '--', 'frontend/public/data/cecafe_daily.json'])
          "

      # Per-source Telegram text, fired the moment this data lands (replaces the
      # retired 1.6 morning brief). Runs BEFORE the commit so the state file it
      # writes is committed in the same step. Never fails the scraper.
      - name: Telegram — brazil_daily
        working-directory: backend
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PYTHONPATH=. python -m scraper.topic_notify_daily brazil_daily || true

      - name: Commit updated JSON if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/topic_notify_state.json \
                   frontend/public/data/cecafe_daily.json
          git diff --cached --quiet \
            && echo "No changes." \
            || (git commit -m "data: cecafe daily registration $(date -u +%Y-%m-%d) [skip ci]" && git pull --rebase --autostash --strategy-option=theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}")

      # Vercel redeploy is handled by the standalone "1.12 – Daily Publish"
      # workflow (10:00 UTC, after this job), so a flaky Cecafe fetch no longer
      # blocks the daily deploy.

      - name: Notify on failure — but only if the DATA has gone stale
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # Cecafe's site is intermittently unreachable from GitHub runners. The
        # scraper already retries three times inside the run, keeps the last
        # good JSON, and the next cron picks the data up — so a single failed
        # window costs nothing and used to send an alert anyway, roughly twice
        # a week. Alerts that fire on recoverable events stop being read, and
        # then the one that matters is missed too.
        #
        # So the run still goes red — the failure is real and belongs in the
        # run record — but the phone only buzzes once the DATA is actually
        # behind. Cecafe publishes each business day; three days covers a long
        # weekend plus one missed window before anything is genuinely wrong.
        run: |
          STALE_DAYS=3
          FILE=frontend/public/data/cecafe_daily.json
          age=$(python3 - "$FILE" <<'PY'
          import json, sys
          from datetime import date
          try:
              d = json.load(open(sys.argv[1]))
              y, m, dd = (int(x) for x in d["updated"].split("-"))
              print((date.today() - date(y, m, dd)).days)
          except Exception:
              print(999)   # unreadable stamp: treat as stale and alert
          PY
          )
          echo "cecafe_daily.json is ${age} day(s) old (alert threshold ${STALE_DAYS})"
          if [ "$age" -lt "$STALE_DAYS" ]; then
            echo "Fetch failed but the data is still current — no alert. Next cron will retry."
            exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=🚨 ${{ github.workflow }} — Cecafe data is ${age}d old (fetch failing) — $(date -u +'%Y-%m-%d %H:%M UTC') — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
