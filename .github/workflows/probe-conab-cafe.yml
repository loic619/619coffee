name: "Probe: CONAB coffee historical series (temporary)"

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --quiet requests openpyxl xlrd
      - name: Probe
        working-directory: backend
        run: PYTHONPATH=. python -m scraper.probe_conab_cafe
