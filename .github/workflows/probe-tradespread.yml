name: "Probe: acaphe tradespread page (temporary)"

# TEMPORARY — dumps the structure of acaphe.com/tradespread.php so a parser can
# be written against it. Delete together with backend/scraper/probe_tradespread.py.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: backend
        run: pip install --quiet -r scraper/requirements.txt
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}
      - name: Install Playwright Chromium
        run: sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* || true; playwright install chromium --with-deps || playwright install chromium
      - name: Probe
        working-directory: backend
        env:
          ACAPHE_USER: ${{ secrets.ACAPHE_USER }}
          ACAPHE_PASS: ${{ secrets.ACAPHE_PASS }}
        run: PYTHONPATH=. python -m scraper.probe_tradespread
