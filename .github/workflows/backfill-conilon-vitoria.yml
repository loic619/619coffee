name: "Z – Backfill: Conilon Vitória disponível"

# One-shot: walk the noticiasagricolas date-URLs for the Vitória-ES conilon
# disponível market to build brazil_conilon_vitoria.json (every grade quote +
# the CCCV Tipo 7/8 benchmark), and commit it to this branch.

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Backfill start date (YYYY-MM-DD)"
        required: false
        default: "2022-06-01"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install beautifulsoup4
      - name: Backfill Vitória conilon history
        working-directory: backend
        run: python -m scraper.sources.brazil_conilon_vitoria backfill "${{ inputs.start }}"
      - name: Seed brazil_conilon origin history from the archive
        working-directory: backend
        run: python -m scraper.sources.brazil_conilon_vitoria seed-origin
      - name: Commit generated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/brazil_conilon_vitoria.json frontend/public/data/origin_prices_history.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: backfill Vitória conilon disponível history [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin "${{ github.ref_name }}" && git push && exit 0
              sleep $((RANDOM % 5 + 3))
            done
            echo "::error::push failed"; exit 1
          fi
