name: "1.19 – Sucafina Origin Reports (weekly)"

# Fetches the weekly Sucafina EMEA origin-report PDF (replaces the removed
# Daily Coffee News RSS source as the origin-news feed) and commits the parsed
# per-origin sections for the News-tab panel. Reports publish Wednesdays;
# fetching Thu + Sat catches late uploads. Idempotent — already-stored weeks
# are skipped, so extra runs are free.

on:
  schedule:
    - cron: '23 6 * * 4'    # Thu 06:23 UTC (off-round minute — GH cron skip)
    - cron: '23 7 * * 6'    # Sat 07:23 UTC backstop
  workflow_dispatch:

# Own lane — NOT the shared `data-commit` group.
#
# 25 workflows used to sit in that one group. GitHub's concurrency model only
# protects the RUNNING member: `cancel-in-progress: false` keeps the in-progress
# run alive, but the queue holds exactly ONE pending run, so whenever a third
# member arrives the one already waiting is CANCELLED outright — its scraped
# data thrown away before it ever ran. Observed 2026-08-14 on 1.3 Daily OI:
# three cancelled runs in one morning, one of them killed after 31 minutes.
# 1.16 hit the same thing and was given its own lane in August for exactly this
# reason; this generalises that fix.
#
# Serialising the push is what the shared group was really buying, and that is
# now handled properly by .github/actions/commit-data, which re-syncs with
# origin/main and retries with backoff on every attempt.
concurrency:
  group: scraper-sucafina
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install playwright pdfplumber

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Playwright browser
        run: sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* || true; playwright install chromium --with-deps || playwright install chromium

      - name: Fetch Sucafina origin reports
        working-directory: backend
        run: python -m scraper.fetch_sucafina_reports

      - name: Commit updated reports if changed
        uses: ./.github/actions/commit-data
        with:
          files: frontend/public/data/sucafina_reports.json
          message: "data: sucafina origin reports [skip ci]"
