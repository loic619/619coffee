name: "0.1 – Acaphe Live Quotes Poll"

# Polls acaphe.com via the --once mode of acaphe_poller.py and pushes the
# latest snapshot to Upstash Redis. Runs every 5 minutes — the closest GH
# Actions cron allows. Free for public repos.
#
# Replaces the long-running worker model (Render / laptop) with a cron-
# triggered single fetch, so live quotes stay fresh without paying for a
# 24/7 worker.
#
# Required repo secrets:
#   UPSTASH_REDIS_REST_URL
#   UPSTASH_REDIS_REST_TOKEN
# Optional repo secret (for VN physical-price persistence):
#   DATABASE_URL

on:
  schedule:
    # Every 15 min during trading hours Mon–Fri UTC:
    #   RC London   08:00–18:30 UTC
    #   KC New York 08:30–19:00 UTC
    # Explicit minute list instead of `*/15`: GH Actions has silently
    # throttled this workflow's cron twice —
    #   2026-06-03 → 06-08: `*/15` fired 5/48 ticks (Fri), 0 (Mon)
    #   2026-08-04 → 08-06: `0,15,30,45` degraded to ~1 tick per 1.75-2.5h,
    #                       plus a tick killed by runner starvation
    # Editing the file resets the workflow's scheduling priority (the
    # standard GH workaround), and off-peak minutes (:03/:18/:33/:48) are
    # less contended than the :00/:15/:30/:45 marks everyone schedules on.
    # The 1.8 freshness checker also self-heals now: on staleness it
    # dispatches this workflow directly, so a throttled cron degrades to
    # at-most-hourly polls instead of a dead feed.
    - cron: '3,18,33,48 8-19 * * 1-5'
    # VN physical window — 01:00-04:00 UTC = 08:00-11:00 Indochina time.
    #
    # acaphe publishes Dak Lak / HCM bid-offer and the R2 FOB differential
    # only during the Vietnamese morning, and strips them from the page later
    # in the day. The 08-19 UTC block above is anchored to the LONDON/NY
    # futures sessions (15:00-02:00 ICT) and so never once overlapped that
    # window — which is why the poller logs "VN data absent — injected
    # last-known snapshot" on every tick, why the `if viet.get("bmt_bid")`
    # branch that writes the DB has not fired since April, and why
    # vietnam_last.json has been frozen at 2026-04-24.
    #
    # Futures fields are simply absent/stale on these early ticks; that is
    # harmless — the poller writes whatever the payload contains and the
    # 08-19 block remains the source of truth for RC/KC.
    # WIDENED 2026-08-24: the window was 01:00-04:00 UTC (08:00-11:52 ICT) and
    # the VN panel still went 9 days stale (Aug 15-24). Two reasons: acaphe
    # intermittently serves the stub 'acaphe()' in that field instead of the
    # block, and this workflow's cron gets throttled (documented twice above),
    # so a narrow window can miss every publishing minute of the day. 00:00-
    # 07:59 UTC = 07:00-14:59 ICT covers the whole Vietnamese morning and early
    # afternoon while staying entirely BEFORE the 08:00 UTC London open, which
    # keeps the VN_ONLY semantics below honest (futures genuinely off-session).
    - cron: '7,27,47 0-7 * * 1-5'
  workflow_dispatch:

# If a previous run is still in progress when the next cron tick fires,
# cancel it and let the fresh one through. Stale snapshots are worthless for
# live quotes — and queueing would let backlog build unbounded if a slow
# fetch coincides with the next tick (4-min timeout × 15-min cadence is
# tight enough that this matters). cancel-in-progress: true ensures the
# freshest tick wins.
concurrency:
  group: acaphe-poll
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 8 (was 4): the job-level timeout clock starts when the job is ASSIGNED,
    # and on 2026-08-06 a runner-starved tick burned 3+ min in queue/setup and
    # was killed before polling. cancel-in-progress still guarantees the
    # freshest tick wins, so the longer ceiling costs nothing on good days.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Skip when Upstash secrets are missing
        id: gate
        env:
          URL:   ${{ secrets.UPSTASH_REDIS_REST_URL }}
          TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          if [ -z "$URL" ] || [ -z "$TOKEN" ]; then
            echo "::warning::Upstash secrets not configured — add UPSTASH_REDIS_REST_URL and UPSTASH_REDIS_REST_TOKEN as repo secrets to enable polling."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip == 'false'
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/scraper/requirements.txt

      # The poller needs requests + playwright, and sqlalchemy/psycopg2 for the
      # VN daily row (scraper.db). Installing the whole scraper stack (scipy,
      # yfinance, curl_cffi, …) cost ~19s of a ~55s run for packages this job
      # never imports — the same waste fixed for the morning brief in d6212be.
      #
      # sqlalchemy is NOT optional despite _save_vn_prices_to_db being wrapped
      # in try/except: without it the write fails silently and the VN daily
      # history quietly stops accruing, which is how vietnam_last.json sat
      # frozen from April to August unnoticed.
      - name: Install Python dependencies
        if: steps.gate.outputs.skip == 'false'
        run: pip install --quiet requests playwright sqlalchemy psycopg2-binary

      # Cache the chromium binary (~120 MB) across the ~50 runs/week. On a hit,
      # `playwright install` skips the download; --with-deps still ensures OS
      # libs (fast on the hosted image where most are preinstalled).
      #
      # Still installed unconditionally even though the poller now reuses a
      # cached session and usually never launches a browser: whether the cookie
      # cache hits is only known inside the poller, and a cache miss with no
      # Chromium on disk would turn a recoverable re-login into a failed run.
      # ~9s on a cache hit is the price of that safety net.
      - name: Cache Playwright browser
        if: steps.gate.outputs.skip == 'false'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Playwright Chromium
        if: steps.gate.outputs.skip == 'false'
        run: sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* || true; playwright install chromium --with-deps || playwright install chromium

      - name: Poll once and push to Upstash
        if: steps.gate.outputs.skip == 'false'
        working-directory: backend
        env:
          UPSTASH_REDIS_REST_URL:   ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          DATABASE_URL:             ${{ secrets.DATABASE_URL }}
          ACAPHE_USER:              ${{ secrets.ACAPHE_USER }}
          ACAPHE_PASS:              ${{ secrets.ACAPHE_PASS }}
          # The 00:00-08:00 UTC block chases the Vietnamese day only. At that
          # hour London and New York are shut, so the futures half of the payload
          # is off-session: persist the VN snapshot but leave `live_quotes` alone.
          # github.event.schedule is the literal cron string that fired, and is
          # empty for workflow_dispatch (a manual run stays full-fidelity).
          ACAPHE_VN_ONLY: ${{ github.event.schedule == '7,27,47 0-7 * * 1-5' }}
        run: python -m scraper.acaphe_poller --once

      # vietnam_last.json is the panel's fallback when Redis is empty, but no
      # step ever committed it — so it sat frozen at 2026-04-24 while only the
      # Redis key moved. Persist it whenever the VN block was actually parsed.
      - name: Commit the Vietnam snapshot
        if: steps.gate.outputs.skip == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/vietnam_last.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "VN snapshot unchanged."; else
            git commit -m "data: vietnam physical snapshot [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
              sleep $((RANDOM % 5 + 3))
            done
            echo "::warning::VN snapshot push failed (Redis still updated)"
          fi
