name: "3.3.3 – Monthly Scraper · Vietnam Fertilizer"

on:
  # Cron removed 2026-08: triggered by '1.17 - Source Sentinel' on publication-day
  # detection (probes the source site daily in its release window). Manual dispatch
  # remains; the sentinel also verifies ingestion and alarms if a release is missed.
  workflow_dispatch:

# Own lane — NOT the shared `data-commit` group.
#
# 25 workflows used to sit in that one group. GitHub's concurrency model only
# protects the RUNNING member: `cancel-in-progress: false` keeps the in-progress
# run alive, but the queue holds exactly ONE pending run, so whenever a third
# member arrives the one already waiting is CANCELLED outright — its scraped
# data thrown away before it ever ran. Observed 2026-08-14 on 1.3 Daily OI:
# three cancelled runs in one morning, one of them killed after 31 minutes.
# 1.16 hit the same thing and was given its own lane in August for exactly this
# reason; this generalises that fix.
#
# Serialising the push is what the shared group was really buying, and that is
# now handled properly by .github/actions/commit-data, which re-syncs with
# origin/main and retries with backoff on every attempt.
concurrency:
  group: scraper-monthly-vn-fertilizer
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/scraper/requirements.txt

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r scraper/requirements.txt pandas requests python-dotenv openpyxl xlrd

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Playwright browser
        run: sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* || true; playwright install chromium --with-deps || playwright install chromium

      - name: Run Vietnam fertilizer scraper (3 attempts)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          for attempt in 1 2 3; do
            python -m scraper.run_monthly vn_fertilizer && break
            [ $attempt -lt 3 ] && echo "Attempt $attempt failed, retrying in 5m..." && sleep 300 || exit 1
          done

      - name: Commit cache file if changed
        run: |
          set -x
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p backend/scraper/cache
          # backend/scraper/cache/ is .gitignored locally; force-add the files.
          git add -f backend/scraper/cache/vn_fertilizer.json || echo "  (vn_fertilizer.json not added)"
          if git diff --cached --quiet; then
            echo "No cache changes."
          else
            git commit -m "data: vn_fertilizer monthly update [skip ci]"
            git pull --rebase --autostash --strategy-option=theirs origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=🚨 ${{ github.workflow }} failed — $(date -u +'%Y-%m-%d %H:%M UTC') — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
