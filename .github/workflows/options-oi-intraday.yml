name: "1.3b – Options OI intraday refresh"

# Second options fetch at ~14:10 UTC Mon-Fri. The 02:13 UTC snapshot (riding
# 1.3) runs before ICE's next-morning OI publication, so its open interest is
# one session behind its prices. ICE's FINAL OI posts during the US morning;
# this run re-fetches the boards and UPSERTS the same date's row + archive
# entry, upgrading the day's numbers from preliminary to final.

on:
  schedule:
    - cron: '10 14 * * 1-5'
  workflow_dispatch:

concurrency:
  group: options-oi-intraday
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}
      - name: Install dependencies
        run: |
          pip install playwright requests
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* || true
          playwright install chromium --with-deps || playwright install chromium
      - name: Fetch options boards (final OI)
        env:
          PYTHONPATH: backend
        run: python backend/scraper/fetch_options_json.py
      - name: Options Telegram note
        continue-on-error: true
        working-directory: backend
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PYTHONPATH=. python -m scraper.topic_notify_daily options || true
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/options_oi.json
          [ -f data/options_boards_archive.json ] && git add data/options_boards_archive.json || true
          [ -f frontend/public/data/options_strike_history.json ] && git add frontend/public/data/options_strike_history.json || true
          [ -f data/topic_notify_state.json ] && git add data/topic_notify_state.json || true
          if git diff --cached --quiet; then echo "No changes."; else
            git commit -m "data: options OI intraday refresh [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
              sleep $((RANDOM % 5 + 3))
            done
            echo "::error::push failed"; exit 1
          fi
