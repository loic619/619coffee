name: "3.4.2 – On-demand · Apply crop-estimate edit (admin UI)"

# The admin "edit mode" on each origin's S&D card posts edited production
# estimates to /api/admin/crop-estimates (password checked server-side in
# the Next.js route); that route dispatches THIS workflow with the payload.
# scripts/apply_crop_estimate_edit.py validates the edit strictly and
# rewrites the origin's balance-sheet seed; the commit lands on main
# WITHOUT [skip ci] so Vercel's git integration redeploys and the edit is
# live for everyone (~2 min end-to-end).
#
# Companion of 3.11 (refresh-balance-sheets), which machine-syncs only the
# USDA column twice a year — this path is how the hand-curated columns
# (CONAB / FNC / GAEKI / UCDA / MARD / ICO) get updated without editing
# JSON in git by hand.

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Edit payload JSON: {origin, updated, seasons:[{season, forecast, production}]}"
        required: true
        type: string
      origin:
        # Duplicated out of the payload purely so the concurrency group can
        # read it — expressions cannot reach inside a JSON string input, and
        # the applier re-derives the origin from the payload itself, so a
        # mismatch here can misroute the queue but can never misroute a write.
        description: "Origin key, for the per-origin concurrency group"
        required: false
        default: "unknown"
        type: string

concurrency:
  # PER ORIGIN, and this is not a nicety. A concurrency group holds at most
  # ONE queued run: when a third arrives GitHub silently CANCELS the pending
  # one, and cancel-in-progress:false does not change that. The by-source
  # editor saves every origin in one go — one dispatch each — so a single
  # group meant most origins were cancelled while the UI reported success.
  # Measured at 4 cancellations in 7 runs before this change.
  #
  # Keyed per origin, concurrent saves no longer contend, and two saves of
  # the SAME origin still serialise, which is the one case where
  # latest-wins is correct.
  group: crop-estimate-edit-${{ inputs.origin }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Write payload
        # Via env, not inline interpolation — the payload is remote input and
        # must never be shell-expanded.
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: printf '%s' "$PAYLOAD" > /tmp/crop_edit_payload.json

      - name: Validate and apply edit
        id: apply
        working-directory: backend
        run: PYTHONPATH=. python scripts/apply_crop_estimate_edit.py --payload /tmp/crop_edit_payload.json

      - name: Commit & push
        # `target`/`origin` come from the script's allowlisted ORIGINS map,
        # never from the raw payload, so they're safe to interpolate.
        if: steps.apply.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.apply.outputs.target }}"
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "data(crop-estimates): ${{ steps.apply.outputs.origin }} estimates edited via admin UI"
            git pull --rebase --autostash --strategy-option=theirs origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Notify on failure or cancellation
        if: failure() || cancelled()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=🚨 ${{ github.workflow }} ${{ job.status }} — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
