name: "1.5 – Check Data Pipeline Freshness"

# Reads frontend/public/data/health.json and pings Telegram if anything is
# stale. Three checks in one workflow:
#
#   scrapers:  per-upstream-source timestamp — "when did the source last
#              write data into our DB". Catches a silently-failing scraper.
#
#   exporters: per-topic timestamp — "when did workflow 1.4 last publish
#              this topic's static JSON". Catches a silently-failing
#              exporter (scraper succeeded but the JSON write didn't),
#              which the scrapers-only check used to miss. Added 2026-06
#              after the export_static_json.py failure-isolation refactor
#              (PR #423 / #424) made per-topic failures non-fatal — that
#              gain in resilience needed an observability backstop here.
#
#   artifacts: last data date INSIDE key committed time-series files.
#              Catches the layer both maps above miss: an exporter that
#              runs green and regenerates its file, whose bytes then never
#              reach main (e.g. missing from 1.4's git-add allowlist).
#              Added 2026-07 after futures_price_history.json froze for a
#              week that exact way while health.json showed the exporter
#              fresh every day.
#
#   panel:     the open-direction prediction payload served to the Macro tab.
#              Its runner keeps the last good payload when the model can't
#              train, which is right for the record but means a dead model
#              would render as a confident call, with every check above green
#              because the SCRIPT ran fine. Added 2026-08. No freeze has
#              actually occurred — the 2026-08-21 audit verified for_session
#              advancing every trading day — but nothing else here can see
#              inside the payload, so nothing else could tell.

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily — ~4 h after export-and-publish typically lands (~02:55 UTC)
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check data pipeline freshness
        id: check
        env:
          HEALTH_FILE: frontend/public/data/health.json
        run: |
          python - <<'PY'
          import json, os, sys
          from datetime import datetime, timezone

          # Per-scraper staleness threshold in hours. CFTC publishes COT
          # reports as-of Tuesday on Friday evening, so by Friday morning the
          # latest available data is legitimately ~10 days old by as-of date.
          # 11 days gives one publication cycle of slack before alerting.
          # The fertilizer sources are monthly (World Bank Pink Sheet on the
          # 2nd of each month, MDIC Comex around the 12th–15th); 45 days
          # gives one missed-cycle buffer.
          THRESHOLDS_H = {
              # Daily / near-daily sources (2-day buffer)
              "futures":              48,
              # Freight: scraped Fri + Sun only (1.2 cron `19 2 * * 5,0`). The
              # Freightos index publishes weekly with the data stamped at end-of-
              # week, so `FreightRate.date` lands on Fridays and stays there
              # through the Sun re-scrape. 9-day limit = one missed weekly
              # publish + 2-day buffer; a 2-day limit fires every Monday morning
              # by design even when the scraper is healthy.
              "freight":              9 * 24,
              "weather":              48,
              "enso":                 48,
              "vietnam_price":        48,  # giacaphe.com via vietnam.py — silent-failed Apr 23 → May 14 2026
              # CCI is produced by quant-currency-index Mon-Fri only (`30 21 * * 1-5`).
              # 96 h matches sibling fx_history's "4-day buffer over weekends"
              # threshold — both files come out of the same workflow run.
              "quant_currency_index": 96,
              "fx_history":           96,  # Macro tab FX time-series; weekday-only workflow, 4-day buffer over weekends
              # News sentiment ships in quant_report.json from the SAME weekday-only
              # quant workflow (~21:30 UTC Mon–Fri), so Fri-night→Mon-morning ≈ 2.4d
              # tripped the 2-day default every Monday. 96h matches its siblings.
              "news_sentiment":       96,  # sentiment in quant_report.json, weekday-only
              "origin_prices":        48,  # Macro tab Origin Prices time-series (accumulator, runs in 1.4)
              # Monthly source — Retail CPI series publishes on the 10th–15th of each month
              "retail_cpi":           45 * 24,
              "us_cpi":               45 * 24,  # BLS CPI-U release, monthly (~mid-month)
              # Weekly/rolling sources
              "cot":              11 * 24,   # CFTC COT report (weekly, Fri PM)
              "macro_cot":        11 * 24,
              # Once-a-week scrapers (10d = 7-day cadence + GH cron delay + a
              # weekend/holiday; still fires within days of a genuinely missed
              # weekly cycle, e.g. a cancelled run).
              "port_activity":    10 * 24,   # PortWatch (weekly, Wed)
              "spot_coffee":      10 * 24,   # spot offers (weekly, Mon)
              "enso_indices":     10 * 24,   # NOAA ENSO indices (weekly, Tue)
              "enso_subsurface":  10 * 24,   # NOAA subsurface WWV (weekly, Tue)
              # Weekday-only market log — Fri stamp sits over the weekend, and a
              # Monday market holiday pushes it to Tue. 5 days covers Fri→Wed
              # without crying wolf every Sunday (the 2-day default did).
              "open_direction":   5 * 24,    # open-direction log (Mon–Fri)
              # Monthly sources (one missed cycle + buffer)
              "fertilizer_wb":    45 * 24,   # World Bank Pink Sheet (monthly)
              "fertilizer_comex": 45 * 24,   # MDIC Comex (monthly, mid-month)
              "brazil_exports":   45 * 24,   # Cecafe monthly green-coffee report
              # USDA "Coffee: World Markets and Trade" is SEMI-ANNUAL (Jun & Dec),
              # not monthly — the DB only gains new PSD numbers twice a year, so a
              # 45-day limit cried wolf every July–December. 210 days (≈7 months)
              # clears the normal Jun→Dec gap yet still flags a genuinely missed
              # publish within ~4 weeks.
              "psd_coffee":       210 * 24,  # USDA PSD (semi-annual: Jun & Dec)
              # World Bank SP.POP.TOTL is revised about once a year and the job
              # that fetches it runs on 15 July, so anything under a year cries
              # wolf for eleven months. 400 days clears the annual cycle plus a
              # late-revision buffer, while still catching a wholly missed year.
              "population":       400 * 24,  # World Bank population (annual, 15 Jul)
              # Monthly trade-stats sources (published mid-month for the prior
              # month; scraped once a month). One missed-cycle buffer, like the
              # other monthly feeds above.
              "us_imports":       45 * 24,   # USITC DataWeb (monthly, ~16th)
              "eu_imports":       45 * 24,   # Eurostat Comext (monthly, ~17th)
              # uganda_exports reads uganda_monthly.json's `updated`, stamped by
              # the UCDA monthly-reports scraper (3.3.6, 16th of each month) —
              # NOT the daily export pipeline like the other *_exports keys, so
              # the 48h default cried wolf 2 days after the rewire (#604). A
              # mid-cycle manual dispatch can phase-shift the stamp (run on the
              # 5th → next scheduled write the 16th of the following month ≈
              # 42d), so one-cycle-plus-buffer like the other monthly feeds.
              # Matches frontend/lib/freshness.ts thresholdDays on this key.
              "uganda_exports":   45 * 24,   # UCDA monthly reports (16th)
              # AJCA is UPLOAD-dated (health.py takes the newest /uploads/YYYY/MM/
              # path from ajca.json = when AJCA last published anything, floored
              # to the 1st). Healthy worst case ≈ 30d month-floor + ~31d between
              # monthly uploads + ≤7d weekly scrape ≈ 68d. 70d alerts within
              # ~2-4 weeks of a genuinely missed publish without crying wolf on
              # AJCA's 5-9 week period lag (which the old period-dated 45d did).
              "ajca":             70 * 24,   # Japan AJCA (monthly uploads)
              "conab_costs":      45 * 24,   # CONAB costs (monthly)
              "conab_safra":      45 * 24,   # CONAB safra (monthly)
              "ecf":              90 * 24,   # ECF port stocks (bi-monthly)
              # Daily business-day source — allow up to 10 days for gaps/holidays
              "cecafe_daily":     10 * 24,
              # ICE certified stocks. Daily stock runs Mon-Fri (data is T-1), so
              # 6 days buffers weekends + a holiday. The two monthly reports are
              # captured by workflow 1.14's 1st-3rd catch window; their month_end
              # tops out ~33 days old just before the next capture, so 38 days
              # alerts within a few days of a missed window (the agreed red-alert
              # that hands the monthly report back to a human).
              "ice_certified_daily":       6 * 24,
              "ice_arabica_ageing":        38 * 24,
              "ice_robusta_age_allowance": 38 * 24,
          }
          DEFAULT_H = 48

          # Per-EXPORTER threshold (for health.json["exporters"], the per-topic
          # publish-success map written by workflow 1.4's orchestrator). Workflow
          # 1.4 runs daily at 02:41 UTC AND fans out from every upstream scraper's
          # workflow_run completion, so every exporter is touched at least once
          # per ~24 h. A 48 h threshold gives one missed daily cycle + a buffer
          # before alerting — wider than that and a one-day flake hides indefinitely.
          EXPORTER_DEFAULT_H = 48
          EXPORTER_THRESHOLDS_H: dict[str, int] = {
              # No per-topic overrides yet. Keep the table here so future
              # topic-specific buffers (e.g. an exporter that legitimately
              # publishes weekly only) land in one obvious place.
          }

          # Committed-artifact checks: newest data date embedded in key derived
          # time-series files, read straight from this checkout of main. This is
          # the only check that sees what actually shipped — the scraper and
          # exporter maps both go green even when the regenerated file is never
          # committed. Each entry: path -> (staleness limit in hours, extractor
          # returning the newest YYYY-MM-DD in the file). Limits allow weekends,
          # holiday clusters and the T+1 export lag before alerting:
          #   futures  — ICE trades Mon–Fri; 6d matches ice_certified_daily.
          #   Brazil   — noticiasagricolas publishes business days; Brazilian
          #              holiday runs (e.g. Carnival Mon+Tue) need extra slack.
          ARTIFACTS = {
              "frontend/public/data/futures_price_history.json":
                  (6 * 24, lambda d: max(s[-1]["date"] for s in (d.get("arabica"), d.get("robusta")) if s)),
              "frontend/public/data/brazil_arabica_fisico.json":
                  (7 * 24, lambda d: d["history"][-1]["date"] if d.get("history") else None),
              "frontend/public/data/brazil_b3_arabica.json":
                  (7 * 24, lambda d: d["history"][-1]["date"] if d.get("history") else None),
              # Options board rides the 1.3 daily-OI workflow but is marked
              # continue-on-error there (a Barchart enrichment hiccup must not
              # kill the futures snapshot) — this check surfaces a quiet death.
              "frontend/public/data/options_oi.json":
                  (6 * 24, lambda d: d["history"][-1]["date"] if d.get("history") else None),
              # Brent anchors feed the open-direction panel's oil_shock regime
              # tag. Appended by the 1.16 FX step, which is continue-on-error
              # AND returns 0 both when the symbol is dead and when there is
              # nothing new — so the anchors froze on 2026-07-03 and nothing
              # anywhere said so for seven weeks. The panel simply stopped
              # showing an oil-shock chip, which is indistinguishable from a
              # calm oil tape. Nothing else here covers data/ (this file is
              # outside frontend/public), which is exactly why it hid.
              "data/brent_intraday_anchors.json":
                  (5 * 24, lambda d: d["days"][-1]["date"] if d.get("days") else None),
              # The open-direction model's ONLY real input: it carries the
              # target (rc_open_first vs the prior rc_last_1730) and the sole
              # market feature (kc_after_rc_diff). The 2026-08-21 audit found
              # nothing watching it — no ARTIFACTS entry, and no health.json
              # scraper key covers it either. If it froze, the model would keep
              # training on a stale frame and serving confident calls; only
              # for_session drifting would eventually give it away. 5 days
              # covers Fri→Wed with a Monday holiday.
              "frontend/public/data/intraday_kc_rc_15min.json":
                  (5 * 24, lambda d: d[-1]["date"] if d else None),
          }

          def _parse_ts(ts):
              """Accept YYYY-MM-DD or full ISO; return tz-aware datetime or raise."""
              if len(ts) == 10:
                  return datetime.strptime(ts, "%Y-%m-%d").replace(tzinfo=timezone.utc)
              dt = datetime.fromisoformat(ts.replace("Z", "+00:00"))
              return dt if dt.tzinfo else dt.replace(tzinfo=timezone.utc)

          def _check(name, ts, limit_h, label_prefix=""):
              """Returns a stale-message string or None. `label_prefix` is the
              kind tag shown in the alert ("" for scrapers, "exporter:" for
              exporters) so the operator sees which layer failed."""
              full = f"{label_prefix}{name}"
              if not ts:
                  return f"{full}: never run"
              try:
                  dt = _parse_ts(ts)
              except Exception as e:
                  return f"{full}: unparseable timestamp '{ts}' ({e})"
              age_h = (now - dt).total_seconds() / 3600
              if age_h > limit_h:
                  return f"{full}: {age_h/24:.1f}d old (limit {limit_h/24:.1f}d, last={ts})"
              return None

          path = os.environ["HEALTH_FILE"]
          with open(path) as f:
              health = json.load(f)
          scrapers  = health.get("scrapers",  {})
          exporters = health.get("exporters", {})  # added in PR #423; absent on pre-rollout health.json

          now = datetime.now(timezone.utc)
          stale = []

          # 1. Per-scraper (upstream source freshness).
          for name, ts in scrapers.items():
              msg = _check(name, ts, THRESHOLDS_H.get(name, DEFAULT_H))
              if msg: stale.append(msg)

          # 2. Per-exporter (publish-layer freshness). Catches a scraper that
          # worked but whose export_<topic>(db) raised, which the scrapers-only
          # check used to miss entirely.
          for name, ts in exporters.items():
              msg = _check(name, ts, EXPORTER_THRESHOLDS_H.get(name, EXPORTER_DEFAULT_H),
                           label_prefix="exporter:")
              if msg: stale.append(msg)

          # 3. Committed-artifact content freshness (see ARTIFACTS above).
          for apath, (limit_h, extract) in ARTIFACTS.items():
              name = os.path.basename(apath)
              try:
                  with open(apath) as f:
                      last = extract(json.load(f))
              except FileNotFoundError:
                  stale.append(f"artifact:{name}: file missing"); continue
              except Exception as e:
                  stale.append(f"artifact:{name}: unreadable ({e})"); continue
              msg = _check(name, last, limit_h, label_prefix="artifact:")
              if msg: stale.append(msg)

          # 4. Open-direction panel payload (the Macro tab's prediction card).
          # Its runner writes ONE prediction per session and, when the model
          # cannot train, deliberately leaves the last good payload in place —
          # so a frozen panel is byte-for-byte indistinguishable from a healthy
          # one except for the dates. Two independent tripwires, because they
          # fail in different ways:
          #   a) the `stale` marker the runner stamps on the frozen payload —
          #      fires one run after the model goes dark, and carries the
          #      reason. Silent for the first day so a single hiccup that the
          #      next run recovers from doesn't page anyone.
          #   b) for_session not advancing — fires even when the runner dies
          #      outright and never gets to stamp anything. for_session is the
          #      NEXT session, so a Friday run already reads Friday; the
          #      weekend peak is ~2.3d at this workflow's 07:00 UTC slot.
          try:
              with open("frontend/public/data/quant_report.json") as f:
                  od = (json.load(f).get("open_direction") or {})
          except FileNotFoundError:
              stale.append("panel:open_direction: quant_report.json missing"); od = None
          except Exception as e:
              stale.append(f"panel:open_direction: unreadable ({e})"); od = None
          if od is not None:
              if not od:
                  stale.append("panel:open_direction: section absent from quant_report.json")
              elif not od.get("available"):
                  stale.append(f"panel:open_direction: model unavailable "
                               f"({od.get('reason') or 'no reason given'})")
              else:
                  frozen = od.get("stale") or {}
                  if frozen:
                      msg = _check("open_direction frozen", frozen.get("since"), 24,
                                   label_prefix="panel:")
                      if msg:
                          stale.append(f"{msg} — {frozen.get('failed_runs')} failed "
                                       f"runs: {frozen.get('reason')}")
                  msg = _check("open_direction for_session", od.get("for_session"), 4 * 24,
                               label_prefix="panel:")
                  if msg: stale.append(msg)

          if stale:
              msg = "Stale entries in health.json:\n" + "\n".join(f"• {s}" for s in stale)
              print(msg)
              with open(os.environ["GITHUB_OUTPUT"], "a") as g:
                  g.write("stale<<EOF\n" + msg + "\nEOF\n")
              sys.exit(1)
          print(f"All fresh: {len(scrapers)} scrapers, {len(exporters)} exporters, "
                f"{len(ARTIFACTS)} artifacts, open-direction panel live.")
          PY

      - name: Notify Telegram on stale data
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          STALE:              ${{ steps.check.outputs.stale }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets not configured — skipping notification"
            exit 0
          fi
          body="${STALE:-Freshness check failed (no detail captured)}"
          run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          text=$(printf '🚨 Data pipeline stale — see %s\n\n%s' "$run_url" "$body")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            >/dev/null || true
