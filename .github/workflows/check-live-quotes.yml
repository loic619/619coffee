name: "1.8 – Check Live Quotes Freshness"

# Reads `live_quotes` from Upstash and decides what a stale reading MEANS given
# how long it has been stale. Logic lives in backend/scraper/check_live_quotes.py
# with the decision ladder in source_health.py, unit-tested — it used to be ~70
# lines of inline shell that nothing could test.
#
# Schedule mirrors the 0.1 poller's window:
#   poller cron     `3,18,33,48 8-19 * * 1-5`   polls Mon-Fri, 08:00-19:48 UTC
#   checker cron    `15 9-20 * * 1-5`           checks Mon-Fri 09:15-20:15 UTC
# The 1-hour lead-in lets the first poll of the day land + write to Upstash
# before the first check fires, and the trailing tick at 20:15 catches a
# missed-last-poll scenario.
#
# Outside this window (overnight / weekends) the poller is intentionally
# silent, so the freshness check is intentionally silent too — otherwise it
# would fire ~80 false-positive alerts per week.
#
# WHAT CHANGED, 2026-09-04 (see the "A failed workflow is not a failed system"
# research page). This check used to dispatch a rescue AND exit 1 on every
# stale reading, holding no state between runs — so a 12-hour outage produced
# 12 red runs, 12 alerts and 12 rescue dispatches all describing ONE event, and
# backoff was impossible because nothing was remembered. Now the source carries
# a `degraded` state in Upstash and the ladder is:
#
#   rescue dispatched   at stale checks 1, 2, 4, 8, 16, 32   (doubling)
#   alert sent          at stale checks 1, 4, 12, 24, 48
#   run goes RED        at stale checks    4, 12, 24, 48
#
# A red run now means "recovery has repeatedly failed", which is worth a
# person's attention. Detecting staleness and dispatching a rescue is the
# watchdog WORKING, and stays green.
#
# The rescue dispatch failing is the one thing that is always loud, whatever
# the backoff says: the old `if curl -sf` guard meant that losing the
# actions:write scope stopped the self-heal SILENTLY while the check kept
# passing — a self-healing system that had quietly stopped healing.

permissions:
  contents: read
  actions: write

on:
  schedule:
    - cron: '15 9-20 * * 1-5'   # Mon-Fri, 09:15-20:15 UTC, hourly at :15
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write            # to dispatch the rescue run of the 0.1 poller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests
      - name: Check freshness, decide, act
        env:
          UPSTASH_REDIS_REST_URL:   ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:         ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN:             ${{ github.token }}
          # The poller writes every 15 minutes during the trading window.
          # 2h = 8 consecutive missed polls — well beyond transient delays
          # (GH Actions cron drift is typically <10 min) but short enough
          # to surface a real outage inside one trading day.
          STALE_HOURS:              "2"
          PYTHONPATH: .
        run: python -m backend.scraper.check_live_quotes
