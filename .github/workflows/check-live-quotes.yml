name: "1.8 – Check Live Quotes Freshness"

# Reads `live_quotes` from Upstash Redis and pings Telegram if `fetched_at` is
# older than STALE_HOURS. Schedule mirrors the 0.1 poller's window:
#   poller cron     `*/15 8-19 * * 1-5`   → polls every 15 min, 08:00-19:45 UTC, Mon-Fri
#   checker cron    `15 9-20 * * 1-5`     → checks Mon-Fri 09:15-20:15 UTC
# The 1-hour lead-in lets the first poll of the day land + write to Upstash
# before the first check fires, and the trailing tick at 20:15 catches a
# missed-last-poll scenario.
#
# Outside this window (overnight / weekends) the poller is intentionally
# silent, so the freshness check is intentionally silent too — otherwise it
# would fire ~80 false-positive Telegram alerts per week (every weeknight
# 02:15-09:15 UTC + every weekend Sat 02:15 through Mon 09:15).

# The rescue path dispatches poll-acaphe-quotes, which needs actions:write.
# It is guarded by `if curl -sf`, so losing the scope degraded it SILENTLY:
# the check kept passing while the rescue never fired.
permissions:
  contents: read
  actions: write

on:
  schedule:
    - cron: '15 9-20 * * 1-5'   # Mon-Fri, 09:15-20:15 UTC, hourly at :15
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions:write lets the stale path dispatch a rescue run of the 0.1
    # poller — GH has throttled that workflow's cron twice (Jun + Aug 2026),
    # and self-healing turns a dead schedule into at-most-hourly polls.
    permissions:
      actions: write
    steps:
      - name: Fetch live_quotes and check age
        env:
          UPSTASH_REDIS_REST_URL:   ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:         ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN:             ${{ github.token }}
          # The poller writes every 15 minutes during the trading window.
          # 2h = 8 consecutive missed polls — well beyond transient delays
          # (GH Actions cron drift is typically <10 min) but short enough
          # to surface a real outage inside one trading day.
          STALE_HOURS:              "2"
        run: |
          set -u
          if [ -z "${UPSTASH_REDIS_REST_URL:-}" ] || [ -z "${UPSTASH_REDIS_REST_TOKEN:-}" ]; then
            # Skip rather than fail — the workflow is opt-in. Add
            # UPSTASH_REDIS_REST_URL and UPSTASH_REDIS_REST_TOKEN as
            # GitHub repo secrets to enable the check.
            echo "::warning::Upstash credentials not configured — skipping freshness check. Add UPSTASH_REDIS_REST_URL and UPSTASH_REDIS_REST_TOKEN as repo secrets to enable."
            exit 0
          fi

          url="${UPSTASH_REDIS_REST_URL%/}/get/live_quotes"
          http_code=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -H "Authorization: Bearer ${UPSTASH_REDIS_REST_TOKEN}" "$url")

          notify() {
            local msg="$1"
            echo "::error::$msg"
            if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_CHAT_ID}" \
                -d "text=🚨 Live quotes alert — ${msg} — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                >/dev/null || true
            fi
            exit 1
          }

          if [ "$http_code" != "200" ]; then
            notify "Upstash GET returned HTTP ${http_code}"
          fi

          python - <<'PY' | tee /tmp/check.log
          import json, os, sys
          from datetime import datetime, timezone

          stale_hours = float(os.environ.get("STALE_HOURS", "6"))
          with open("/tmp/resp.json") as f:
              wrapper = json.load(f)

          result = wrapper.get("result")
          if result in (None, ""):
              print("STALE_REASON=Upstash key live_quotes is empty (poller never wrote, or key was evicted)")
              sys.exit(2)

          payload = json.loads(result) if isinstance(result, str) else result
          fetched_at = payload.get("fetched_at")
          if not fetched_at:
              print("STALE_REASON=fetched_at missing from payload (poller may be misconfigured)")
              sys.exit(3)

          ts = datetime.fromisoformat(fetched_at.replace("Z", "+00:00"))
          age_h = (datetime.now(timezone.utc) - ts).total_seconds() / 3600
          print(f"fetched_at={fetched_at} age_hours={age_h:.2f} threshold={stale_hours}")
          if age_h > stale_hours:
              print(f"STALE_REASON=live_quotes is {age_h:.1f}h old (threshold {stale_hours}h) — poller is down")
              sys.exit(4)
          PY
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            reason=$(grep -m1 '^STALE_REASON=' /tmp/check.log | cut -d= -f2-)
            # Self-heal before alerting: dispatch a rescue run of the 0.1
            # poller. Covers the twice-observed GH cron-throttling failure
            # mode (and an evicted Upstash key) without human intervention;
            # the alert still goes out so a genuinely broken poller (login
            # change, site down) gets human eyes on the next hourly check.
            kick=""
            if curl -sf -X POST \
                 -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/repos/${{ github.repository }}/actions/workflows/poll-acaphe-quotes.yml/dispatches" \
                 -d '{"ref":"main"}' >/dev/null; then
              kick=" (rescue poll dispatched)"
            fi
            notify "${reason:-freshness check failed (exit $rc)}${kick}"
          fi
          echo "Live quotes are fresh."
