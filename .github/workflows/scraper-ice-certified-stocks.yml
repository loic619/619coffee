name: "1.13 – ICE Certified Stocks (arabica + robusta)"

# Pulls ICE certified-stocks reports (10 sources) and writes the two static
# JSONs the frontend consumes:
#   frontend/public/data/certified_stocks_arabica.json
#   frontend/public/data/certified_stocks_robusta.json
#
# The `days_back` input lets a test run (e.g. 30) precede the full historical
# backfill. Per-source failures are logged but don't block the run.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke = hit 10 probe-verified URLs once (no commit); backfill = real window"
        required: false
        default: "backfill"
        type: choice
        options:
          - smoke
          - backfill
      days_back:
        description: "Backfill window in business days (e.g. 3 for daily catch-up, 180 for full history)"
        required: false
        default: "7"
        type: string
  schedule:
    # 02:47 UTC Mon-Fri (was 03:00 — moved off the :00 mark to dodge the GH
    # cron skip, and earlier so the run finishes ~03:05: in time for BOTH the
    # 03:09 morning brief (which previously missed it by minutes every day
    # and showed cert stocks a day staler than necessary) and the 03:41
    # production deploy that puts the day's data live before 04:00 UTC.
    # The scraper anchors on the PREVIOUS business day (see orchestrate.run),
    # so it fetches yesterday's already-published reports — the run time
    # doesn't chase same-day publication and an earlier start loses nothing.
    # Mon-Fri with a multi-day backfill window covers Friday's data on Monday;
    # ICE doesn't publish Sat/Sun. Manual dispatch still allowed any day.
    # Runs with --skip-monthly: the monthly ageing / age-allowance reports are
    # handled by their own job (1.14 – ICE Monthly Reports), so the daily run
    # no longer re-fetches a monthly report ~21×/month.
    #
    # NOTE: GH cron on this repo fires 4-5h LATE systematically (verified
    # 2026-06-10 against run history). This cron is the FALLBACK; the primary
    # trigger is the workflow_run chain off 1.1 below.
    # 00:35 UTC Tue-Sat: by 00:35 the prior business day's full report set has
    # been published for hours (last file ~17:02 London), and Saturday's run
    # captures Friday. Even when GH cron fires hours late (observed up to
    # ~19h), the orchestrator's time-aware anchor now targets whichever day's
    # files are actually published, so lateness can no longer serve stale data.
    - cron: '35 0 * * 2-6'
  workflow_run:
    # Chain off the daily scraper so cert stocks land minutes after the
    # scrape (and before the chained morning deploy + brief), instead of
    # waiting on the hours-late cron. Push-originated scraper runs don't
    # cascade — only dispatch/schedule ones (see job-level if).
    workflows: ["1.1 – Daily News Scraper"]
    types: [completed]

# Own lane — NOT the shared `data-commit` group.
#
# 25 workflows used to sit in that one group. GitHub's concurrency model only
# protects the RUNNING member: `cancel-in-progress: false` keeps the in-progress
# run alive, but the queue holds exactly ONE pending run, so whenever a third
# member arrives the one already waiting is CANCELLED outright — its scraped
# data thrown away before it ever ran. Observed 2026-08-14 on 1.3 Daily OI:
# three cancelled runs in one morning, one of them killed after 31 minutes.
# 1.16 hit the same thing and was given its own lane in August for exactly this
# reason; this generalises that fix.
#
# Serialising the push is what the shared group was really buying, and that is
# now handled properly by .github/actions/commit-data, which re-syncs with
# origin/main and retries with backoff on every attempt.
concurrency:
  group: scraper-ice-certified-stocks
  cancel-in-progress: false

jobs:
  scrape:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'workflow_dispatch' || github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-latest
    # Big enough for a one-off 180-day backfill at 5s/req on /marketdata/ (~90
    # min worst case). Daily cron runs in ~10-20 min on a 7-day window.
    timeout-minutes: 120
    permissions:
      contents: write
      # The once-a-day guard below asks the Actions API which runs already
      # succeeded today. The repo-wide default stopped granting actions:read
      # on 24 Aug (see #737), and without it that call 403s — the guard would
      # fail open and scrape every time, silently doing nothing at all.
      # Declared here so it does not depend on the repo default.
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Once-a-day guard — the chain fires far more often than ICE publishes
        id: already
        # 1.1 runs ~3x a day and every completion chains a full cert-stocks
        # scrape, but ICE publishes once per business day and this scraper
        # anchors on the PREVIOUS business day — so runs 2 and 3 re-fetch
        # what run 1 already has. They also collide in the concurrency group,
        # which holds only ONE queued run and cancels the pending one when a
        # third arrives: 12 of 27 runs cancelled in the week to 25 Aug.
        #
        # Fails OPEN on purpose. If the run list cannot be read we scrape,
        # because a wasted run costs minutes and a skipped one costs a day
        # of certified stocks.
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          export TODAY=$(date -u +%Y-%m-%d)
          body=$(curl -s --max-time 30 -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/workflows/scraper-ice-certified-stocks.yml/runs?per_page=30" || true)
          prior=$(printf '%s' "$body" | python3 -c "
          import json, os, sys
          try:
              d = json.load(sys.stdin)
          except Exception as e:
              print(f'[guard] run list unreadable ({e}) — scraping anyway', file=sys.stderr)
              sys.exit(0)
          today = os.environ['TODAY']
          this_run = os.environ['THIS_RUN']
          for r in d.get('workflow_runs', []):
              if str(r['id']) == this_run:
                  continue
              if not (r.get('run_started_at') or '').startswith(today):
                  continue
              if r.get('conclusion') == 'success':
                  print(r['id']); break
          " || true)
          if [ -n "$prior" ]; then
            echo "Already scraped successfully today via run $prior — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No successful run yet today. Proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip guard — weekend, or already scraped today
        id: weekday
        # This step must ALWAYS run: every step below gates on
        # steps.weekday.outputs.skip, and a step skipped by its own `if`
        # publishes no outputs at all — so an empty value would read as
        # "don't skip" and sail straight past both guards. It therefore owns
        # both conditions rather than being gated by the first one.
        #
        # Weekend: the cron is Mon-Fri already, but the workflow_run chain
        # fires daily. The scraper anchors on the previous business day with
        # a multi-day backfill window, so skipping weekends loses nothing
        # (Friday's data is covered by Monday's run).
        run: |
          dow=$(date -u +%u)
          if [ "${{ steps.already.outputs.skip }}" = "true" ]; then
            echo "Already scraped successfully today — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$dow" -ge 6 ] && [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "Weekend chain trigger (dow=$dow) — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.weekday.outputs.skip != 'true'
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.weekday.outputs.skip != 'true'
        # sqlalchemy / psycopg2-binary / python-dotenv / jinja2 are needed for
        # the orchestrator's tail step that emits a news_feed commentary row
        # (see scraper/sources/ice_certified_stocks/news_emit.py). The upsert
        # is a no-op when DATABASE_URL is unset, but importing scraper.db
        # still loads sqlalchemy at module-import time.
        run: pip install requests 'xlrd<2.0' openpyxl pdfplumber sqlalchemy psycopg2-binary python-dotenv jinja2

      - name: Pull ICE certified stocks (3 attempts)
        if: steps.weekday.outputs.skip != 'true'
        working-directory: backend
        env:
          # Force unbuffered stdout so every print() shows up immediately in
          # the Actions log instead of waiting for the (block-buffered) pipe
          # to fill — otherwise a long run looks "stalled" until completion.
          PYTHONUNBUFFERED: "1"
          # Optional — when set, the orchestrator's tail step upserts a
          # news_feed row carrying a `_commentary` block for each market.
          # The next run of workflow 1.4 (Export and Publish) lifts that
          # block to a top-level `commentary` field in news.json. Unset →
          # no-op (snapshots still publish).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Scheduled cron passes no inputs → default to a 7-day catch-up.
          # Widened from 3 (2026-08): the daily iss/recv comparison showed the
          # 3-day window sampled only ~10-50% of each month's activity — days
          # falling between runs (weekend gaps, missed crons) were lost for
          # good since ICE only serves recent daily files. 7 days overlaps
          # every gap a failed run or long weekend can create.
          # (merge preserves the history). Manual dispatch can override with
          # days_back=180 for the one-off historical backfill.
          run_scraper() {
            if [ "${{ inputs.mode }}" = "smoke" ]; then
              python -m scraper.sources.ice_certified_stocks.orchestrate --smoke
            else
              # --skip-monthly: daily feeds only; the monthly ageing /
              # age-allowance reports are pulled by workflow 1.14.
              python -m scraper.sources.ice_certified_stocks.orchestrate \
                --days "${{ inputs.days_back || 7 }}" --skip-monthly
            fi
          }
          # Two attempts, 60s apart — not three at 5 min.
          #
          # Every second of this ladder is billed, and a failed attempt is
          # expensive: the run is dominated by a sequential 4s/req sweep, so one
          # attempt can be 40+ minutes. Three attempts with 5-minute sleeps meant
          # a bad afternoon spent up to the full 120-minute timeout and returned
          # nothing — 10 minutes of that purely asleep between tries.
          #
          # The retry is there for a transient network blip or a 429 abort, and
          # those clear in seconds; a fault that survives 60s is not going to
          # clear by minute five either. A genuinely missed day is backfilled by
          # the workbook ingest, so the cost of giving up early is bounded.
          for attempt in 1 2; do
            run_scraper && break
            [ $attempt -lt 2 ] && echo "Attempt $attempt failed, retrying in 60s..." && sleep 60 || exit 1
          done

      # Per-source Telegram text, fired the moment this data lands (replaces the
      # retired 1.6 morning brief). Runs BEFORE the commit so the state file it
      # writes is committed in the same step. Never fails the scraper.
      - name: Telegram — certified
        working-directory: backend
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PYTHONPATH=. python -m scraper.topic_notify_daily certified || true

      - name: Commit + push if changed
        if: ${{ steps.weekday.outputs.skip != 'true' && inputs.mode != 'smoke' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/topic_notify_state.json \
                   frontend/public/data/certified_stocks_arabica.json \
                  frontend/public/data/certified_stocks_robusta.json \
                  backend/scraper/sources/ice_certified_stocks/stock_report_hits.json
          git diff --cached --quiet \
            && echo "No changes." \
            || (git commit -m "data: ICE certified stocks (${{ inputs.days_back || 30 }}d) [skip ci]" \
                && git pull --rebase --autostash --strategy-option=theirs origin "${GITHUB_REF_NAME}" \
                && git push origin "HEAD:${GITHUB_REF_NAME}")

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=🚨 ${{ github.workflow }} failed — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
